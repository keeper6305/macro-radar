<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>macro-radar v9 QA</title>
<style>
body{margin:0;background:#0d1117;color:#dbe6f3;font:12px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif}
h1{font-size:13px;margin:0;padding:10px 12px;background:#151c26;border-bottom:1px solid #263241;position:sticky;top:0;z-index:2}
#sum{padding:8px 12px;font-size:12px;font-weight:700}
.ok{color:#3ddc97}.ng{color:#ff6b74}.sk{color:#e9a13c}
pre{white-space:pre-wrap;font-size:11px;line-height:1.45;padding:0 12px 30px;margin:0;color:#c8d6e6}
.frames{display:flex;gap:14px;padding:10px 12px;overflow:auto}
iframe{border:1px solid #33445a;background:#070b11;display:block;flex:none}
</style>
</head>
<body>
<h1>macro-radar v9 전수 클릭 QA · 360×800 / 390×844</h1>
<div id="sum">running…</div>
<div class="frames" id="frames"></div>
<pre id="log"></pre>
<script>
/* 이 하네스는 앱과 같은 오리진(GitHub Pages)에서 iframe으로 앱을 띄운다.
   iframe 앱은 이 도메인의 실제 localStorage를 쓰므로, 시작 전에 스냅샷을 뜨고 끝나면 그대로 되돌린다. */
var ORIGIN=location.origin;
var SNAP={};
function snapStorage(){
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); SNAP[k]=localStorage.getItem(k); } }catch(e){}
}
function restoreStorage(){
  try{
    var keep={};
    for(var i=0;i<localStorage.length;i++){ keep[localStorage.key(i)]=1; }
    Object.keys(keep).forEach(function(k){ if(!(k in SNAP)) localStorage.removeItem(k); });
    Object.keys(SNAP).forEach(function(k){ if(localStorage.getItem(k)!==SNAP[k]) localStorage.setItem(k,SNAP[k]); });
  }catch(e){}
}
snapStorage();
/* 이전 점검 실행이 남긴 점검용(:qa) 키를 지워 항상 시드 상태에서 시작한다 */
try{
  Object.keys(SNAP).forEach(function(k){
    if(/:qa$/.test(k)){ delete SNAP[k]; localStorage.removeItem(k); }
  });
}catch(e){}
window.addEventListener('beforeunload',restoreStorage);

var W=parseInt(new URLSearchParams(location.search).get('w')||'360',10);
var H=parseInt(new URLSearchParams(location.search).get('h')||'800',10);
var R={pass:0,fail:0,skip:0,items:[]};
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function rec(state,name,info){ R.items.push({state:state,name:name,info:info||''}); if(state==='pass')R.pass++; else if(state==='fail')R.fail++; else R.skip++; }
function need(cond,msg){ if(!cond) throw new Error(msg||'조건 불충족'); }
function txt(el){ return el?String(el.textContent||'').replace(/\s+/g,' ').trim():''; }

function boot(win){
  var d=win.document;
  function q(s){ return d.querySelector(s); }
  function qa(s){ return Array.prototype.slice.call(d.querySelectorAll(s)); }
  function overflow(sel){
    var bad=[];
    qa(sel).forEach(function(el){
      if(el.scrollWidth>el.clientWidth+1 && el.clientWidth>0){
        bad.push((el.className||el.tagName)+' '+el.scrollWidth+'>'+el.clientWidth);
      }
    });
    return bad;
  }
  function overflowV(sel){
    var bad=[];
    qa(sel).forEach(function(el){
      var de=el.ownerDocument.documentElement;
      if(el.scrollWidth>el.clientWidth+1 && el.clientWidth>0) bad.push((el.className||el.tagName)+' '+el.scrollWidth+'>'+el.clientWidth);
    });
    return bad;
  }
  function pageOverflow(){
    var de=d.documentElement;
    return {doc:de.scrollWidth-W, body:d.body.scrollWidth-W, main:(q('#main')||{}).scrollWidth};
  }
  function cardEls(){
    var a=qa('#main [data-asset]');
    return a.length?a:qa('#main .card.ed');
  }
  function cardIds(){
    return cardEls().map(function(e){
      var b=e.querySelector('[data-mv="up"]');
      return b?b.getAttribute('data-id'):e.getAttribute('data-asset');
    });
  }
  function shown(el){ return !!el && el.getClientRects().length>0; }
  function fire(el,type,cx,cy,extra){
    var ev=new win.PointerEvent(type,Object.assign({bubbles:true,cancelable:true,clientX:cx,clientY:cy,pointerType:'touch',pointerId:1,isPrimary:true},extra||{}));
    el.dispatchEvent(ev);
  }
  return {d:d,win:win,q:q,qa:qa,overflow:overflow,overflowV:overflowV,pageOverflow:pageOverflow,fire:fire,cardEls:cardEls,cardIds:cardIds,shown:shown};
}

async function run(){
  snapStorage();
  var frames=document.getElementById('frames');
  var f=document.createElement('iframe');
  f.width=W; f.height=H; f.src='../index.html?qa=1&t='+Date.now();
  frames.appendChild(f);
  await new Promise(function(r){ f.addEventListener('load',r,{once:true}); });
  var win=f.contentWindow, X=boot(win), d=X.d, q=X.q, qa=X.qa;
  var cryptoBtc=null;
  await wait(2200); /* 데이터·자동 실시간 시도가 끝날 시간 */

  /* ---------- 1. 부팅·레이아웃 ---------- */
  try{
    need(qa('#main .card').length>=4,'카드가 렌더되지 않음');
    need(txt(q('#asof')).indexOf('불러오는 중')<0,'헤더 기준시각이 로딩 상태');
    need(!txt(q('#main')).match(/undefined|NaN|\[object/),'본문에 undefined/NaN');
    rec('pass','부팅 · 헤더 기준시각 · 데이터 렌더',txt(q('#asof')));
  }catch(e){ rec('fail','부팅 · 헤더 기준시각 · 데이터 렌더',e.message); }

  try{
    var po=X.pageOverflow();
    need(po.doc<=1,'문서 가로 넘침 '+po.doc+'px');
    need(po.body<=1,'body 가로 넘침 '+po.body+'px');
    var tb=q('.tabs').getBoundingClientRect();
    need(Math.abs(tb.bottom-win.innerHeight)<2,'탭바가 화면 하단에 붙지 않음');
    var main=q('#main'), pad=parseFloat(win.getComputedStyle(main).paddingBottom);
    need(pad>=80,'본문 하단 여백 부족 '+pad);
    rec('pass','360 레이아웃 · 가로 넘침 0 · 하단 탭바 고정');
  }catch(e){ rec('fail','360 레이아웃 · 가로 넘침 0 · 하단 탭바 고정',e.message); }

  try{
    var errs=(win.__errs||[]).slice();
    need(errs.length===0,'콘솔 에러 '+errs.length+'건: '+errs[0]);
    rec('pass','콘솔 에러 0');
  }catch(e){ rec('fail','콘솔 에러 0',e.message); }

  /* ---------- 2. 거시 리본 (신규) ---------- */
  try{
    var rb=q('#ribbon');
    if(!rb){ rec('skip','거시 리본 표시','신규 기능 미구현'); }
    else{
      need(txt(rb).indexOf('긴축')>=0,'국면 라벨 없음');
      need(qa('#ribbon .rdot').length===6,'반전 6신호 점 없음');
      rec('pass','거시 리본 구성 · '+(rb.hidden?'지표 탭에선 숨김(히어로 중복)':'표시'),txt(rb));
    }
  }catch(e){ rec('fail','거시 리본',e.message); }

  /* ---------- 3. 지표 탭 ---------- */
  try{
    var cards=qa('#main .card[data-ind]');
    need(cards.length>=9,'지표 카드 '+cards.length+'개');
    need(q('#main .card.hero'),'국면 히어로 없음');
    need(qa('#main .cl li').length===6,'반전 체크리스트 6개 아님');
    need(qa('#main .chart').length>=8,'차트 8개 미만');
    need(q('#main .gauge'),'게이지 없음');
    var bad=X.overflow('#main .rh, #main .ch, #main .val, #main .upd');
    need(!bad.length,'지표 카드 내부 넘침: '+bad.join(', '));
    var crc=q('#main [data-ind="crypto"]');
    if(crc){ var r0=crc.querySelector('.row .rv'); cryptoBtc=r0?txt(r0).replace(/\s+/g,''):null; }
    rec('pass','지표 탭 · 카드 '+cards.length+' · 차트 '+qa('#main .chart').length+' · 체크리스트 6');
  }catch(e){ rec('fail','지표 탭',e.message); }

  /* ---------- 4. 차트 툴팁 ---------- */
  try{
    var box=q('#main .chart');
    var svg=box.querySelector('svg'), r=svg.getBoundingClientRect();
    X.fire(svg,'pointerdown',r.left+r.width*0.62,r.top+r.height*0.5);
    await wait(150);
    var tip=box.querySelector('.ctip');
    need(tip.classList.contains('on'),'툴팁이 켜지지 않음');
    need(/·/.test(txt(tip)),'툴팁에 값 구분 없음: '+txt(tip));
    need(box.querySelector('.cross').style.display!=='none','크로스헤어 없음');
    rec('pass','차트 터치 툴팁 · 크로스헤어',txt(tip));
    X.fire(svg,'pointerleave',0,0);
  }catch(e){ rec('fail','차트 터치 툴팁',e.message); }

  /* ---------- 5. 종목 탭 ---------- */
  try{
    q('.tab[data-tab="companies"]').click(); await wait(400);
    var cards2=X.cardEls();
    need(cards2.length>=8,'종목 카드 '+cards2.length);
    var bad2=X.overflow('#main .ah, #main .aleg, #main .mbmeter, #main .actrow, #main .pfrow');
    need(!bad2.length,'종목 카드 내부 넘침: '+bad2.join(', '));
    rec('pass','종목 탭 · 카드 '+cards2.length+' · 내부 넘침 0');
  }catch(e){ rec('fail','종목 탭',e.message); }

  try{
    var btcCard=q('#main [data-asset="btc"]');
    var btcPx=btcCard?txt(btcCard.querySelector('.apx b')).replace(/\s+/g,''):null;
    q('.tab[data-tab="overview"]').click(); await wait(250);
    var crNow=q('#main [data-ind="crypto"] .row .rv');
    cryptoBtc=crNow?txt(crNow).replace(/\s+/g,''):cryptoBtc;
    q('.tab[data-tab="companies"]').click(); await wait(250);
    need(cryptoBtc&&btcPx,'비트코인 표기 비교 불가 ('+cryptoBtc+' / '+btcPx+')');
    need(cryptoBtc===btcPx,'지표 탭 '+cryptoBtc+' ≠ 종목 탭 '+btcPx);
    rec('pass','크립토 지표·종목 숫자 일치',btcPx);
  }catch(e){ rec('fail','크립토 지표·종목 숫자 일치',e.message); }

  try{
    var pf=q('#main .pfcard');
    if(!pf){ rec('skip','보유 평단 대비 요약','신규 기능 미구현'); }
    else{
      var rows=qa('#main .pfcard .pfrow');
      need(rows.length>=2,'보유 행 '+rows.length+'개');
      need(txt(pf).match(/[+-]\d/),'수익률 숫자 없음');
      need(txt(pf).indexOf('평단 대비')>=0,'카드 제목 없음');
      need(qa('#main .pfcard .pfbar').length===rows.length,'막대 수 불일치');
      rec('pass','보유 평단 대비 요약 · '+rows.length+'행',txt(pf).slice(0,120));
    }
  }catch(e){ rec('fail','보유 평단 대비 요약',e.message); }

  try{
    var c0=X.cardEls()[0];
    c0.click(); await wait(300);
    need(!q('#modal').hidden,'상세 시트가 안 열림');
    need(qa('#msheet .msec').length>=4,'상세 섹션 '+qa('#msheet .msec').length);
    var pm=q('#msheet .pmap');
    if(!pm) rec('skip','가격 지도(손절·평단·목표)','신규 기능 미구현');
    else{
      need(txt(pm).indexOf('현재')>=0,'현재 표시 없음');
      need(qa('#msheet .pmap .pmm').length>=3,'가격 지도 마커 '+qa('#msheet .pmap .pmm').length);
      var badm=X.overflowV('#msheet .pmleg, #msheet .pmap, #msheet .mval, #msheet .ins, #msheet .bh');
      need(!badm.length,'상세 시트 가로 넘침: '+badm.join(', '));
      rec('pass','가격 지도 · '+txt(pm).replace(/\s+/g,' ').slice(0,80));
    }
    q('#msheet [data-close]').click(); await wait(250);
    need(q('#modal').hidden,'상세 시트가 안 닫힘');
    rec('pass','종목 상세 열기/닫기');
  }catch(e){ rec('fail','종목 상세',e.message); }

  /* ---------- 6. 순서 편집·추가·삭제 ---------- */
  try{
    var before=X.cardIds();
    q('#btnEditMode').click(); await wait(250);
    var dn=qa('#main [data-mv="down"]')[0];
    need(!!dn,'아래로 버튼 없음');
    dn.click(); await wait(250);
    var after=X.cardIds();
    need(after[0]===before[1]&&after[1]===before[0],'순서 이동 실패 '+before.slice(0,2)+'→'+after.slice(0,2));
    qa('#main [data-mv="up"]')[1].click(); await wait(250);
    var back=X.cardIds();
    need(back[0]===before[0]&&back[1]===before[1],'되돌리기 실패');
    q('#btnEditMode').click(); await wait(200);
    rec('pass','순서 편집 · 아래/위 이동 저장');
  }catch(e){ rec('fail','순서 편집',e.message); }

  try{
    var n0=X.cardEls().length;
    q('#btnAddAsset').click(); await wait(250);
    var nm=q('#msheet [data-f="name"]');
    need(!!nm,'추가 폼 종목명 필드 없음');
    nm.value='QA 테스트 종목'; nm.dispatchEvent(new win.Event('input',{bubbles:true}));
    var pf2=q('#msheet [data-f="price"]'); pf2.value='10000'; pf2.dispatchEvent(new win.Event('input',{bubbles:true}));
    q('#btnSaveAsset').click(); await wait(350);
    var n1=X.cardEls().length;
    need(n1===n0+1,'추가 후 '+n1+'개');
    q('#btnEditMode').click(); await wait(200);
    var delBtn=qa('#main [data-del2]').filter(function(b){return txt(b.closest('.card')).indexOf('QA 테스트 종목')>=0;})[0];
    need(!!delBtn,'추가 종목 삭제 버튼 없음');
    win.confirm=function(){return true;};
    delBtn.click(); await wait(300);
    var n2=X.cardEls().length;
    need(n2===n0,'삭제 후 '+n2+'개 (기대 '+n0+')');
    q('#btnEditMode').click(); await wait(150);
    rec('pass','종목 추가/삭제 · '+n0+'→'+n1+'→'+n2);
  }catch(e){ rec('fail','종목 추가/삭제',e.message); try{q('[data-close]').click();}catch(_){} }

  /* ---------- 7. 브리핑 ---------- */
  try{
    q('.tab[data-tab="briefing"]').click(); await wait(400);
    var segs=qa('#main .seg button');
    need(segs.length===2,'브리핑 구분 '+segs.length);
    need(txt(q('#main .analyst')).indexOf('애널리스트')>=0,'애널리스트 시선 없음');
    need(q('#main .quiz'),'퀴즈 블록 없음');
    var memoBtn=q('#main .quiz [data-qmemo]');
    if(memoBtn && !X.shown(q('#main textarea[data-memo]'))) memoBtn.click();
    await wait(120);
    var ta=q('#main textarea[data-memo]');
    need(!!ta && X.shown(ta),'퀴즈 메모 입력이 안 열림');
    ta.value='QA 메모'; ta.dispatchEvent(new win.Event('input',{bubbles:true})); await wait(120);
    need(txt(q('#main .msave')).indexOf('저장')>=0,'자동 저장 표시 없음');
    rec('pass','브리핑 · 구분 2 · 애널리스트 · 퀴즈 메모 저장');
  }catch(e){ rec('fail','브리핑 탭',e.message); }

  try{
    var qb=q('#main .quiz');
    var reveal=qb.querySelector('[data-qreveal]')||qb.querySelector('details.ans summary');
    if(!reveal){ rec('skip','퀴즈 해설 펼치기','요소 없음'); }
    else{
      var body=qb.querySelector('.ansbody');
      need(txt(body).length>10,'해설 본문이 없음');
      need(!X.shown(body),'해설이 처음부터 열려 있음(내 답 먼저 원칙)');
      reveal.click(); await wait(200);
      need(X.shown(body),'해설이 펼쳐지지 않음');
      rec('pass','퀴즈 해설 펼치기 · 처음엔 닫힘');
    }
  }catch(e){ rec('fail','퀴즈 해설 펼치기',e.message); }

  try{
    var rb2=q('#ribbon');
    if(!rb2) rec('skip','거시 리본 상시 표시','신규 기능 미구현');
    else{
      need(!rb2.hidden,'다른 탭에서 리본이 숨겨짐');
      need(qa('#ribbon .rdot').length===6,'반전 신호 점 6개 아님');
      rec('pass','거시 리본 상시 표시(브리핑 탭)');
    }
  }catch(e){ rec('fail','거시 리본 상시 표시',e.message); }

  try{
    q('#ribbon').click(); await wait(300);
    need(q('.tab.on').getAttribute('data-tab')==='overview','리본을 눌러도 지표 탭으로 안 감');
    rec('pass','거시 리본 탭 → 지표 홈');
    q('.tab[data-tab="briefing"]').click(); await wait(250);
  }catch(e){ rec('fail','거시 리본 탭 이동',e.message); }

  try{
    var seg1=qa('#main .seg button')[0];
    seg1.click(); await wait(300);
    need(q('#main .quiz'),'다른 브리핑에 퀴즈 없음');
    need(txt(q('#main .bh h3')).length>3,'브리핑 제목 없음');
    rec('pass','브리핑 구간 전환');
  }catch(e){ rec('fail','브리핑 구간 전환',e.message); }

  /* ---------- 8. 시나리오 ---------- */
  try{
    q('.tab[data-tab="scenario"]').click(); await wait(400);
    need(qa('#main .scn').length===3,'시나리오 카드 '+qa('#main .scn').length);
    need(qa('#main .donut').length===1,'자금 배분 도넛 없음');
    need(qa('#main .ev li').length>=5,'이벤트 타임라인 부족');
    var bad3=X.overflow('#main .sm, #main .cosum, #main .split .sh');
    need(!bad3.length,'시나리오 넘침: '+bad3.join(', '));
    rec('pass','시나리오 · 3카드 · 도넛 · 이벤트 '+qa('#main .ev li').length);
  }catch(e){ rec('fail','시나리오 탭',e.message); }

  /* ---------- 9. 도감 ---------- */
  try{
    q('.tab[data-tab="study"]').click(); await wait(400);
    var items=qa('#main details.study');
    need(items.length===26,'도감 '+items.length+'장');
    need(txt(q('#main .sprog')).match(/\d+%/),'진행률 없음');
    var sf=qa('#main .sfilter button');
    need(sf.length>=1,'태그 필터 없음');
    rec('pass','도감 · 26장 · 진행률 · 태그 필터 '+sf.length);
  }catch(e){ rec('fail','도감 기본',e.message); }

  try{
    var stf=qa('#main .sstatus button');
    if(!stf.length){ rec('skip','도감 상태 필터(미학습/애매/완료)','신규 기능 미구현'); }
    else{
      need(stf.length>=4,'상태 필터 '+stf.length);
      var amb=stf.filter(function(b){return txt(b).indexOf('애매')>=0;})[0];
      amb.click(); await wait(300);
      var open1=qa('#main details.study');
      need(open1.every(function(x){return x.classList.contains('s1');}),'애매 필터 결과에 다른 상태 섞임');
      stf[0].click(); await wait(250);
      rec('pass','도감 상태 필터 · 애매만 '+open1.length+'장');
    }
  }catch(e){ rec('fail','도감 상태 필터',e.message); }

  try{
    var first=qa('#main details.study')[0];

    var rv1=await sellOnce(rcard,5,10000);
    need(/실현손익/.test(rv1)&&/\+5,000원/.test(rv1),'매도 미리보기 실현손익 없음: '+rv1.slice(0,140));
    var r1=JSON.parse(localStorage.getItem(realKey)||'{}');
    need((r1.items||[]).length===1,'실현손익 기록 '+((r1.items||[]).length)+'건(기대 1)');
    need(Math.round(r1.items[0].pnl)===5000,'기록 손익 '+r1.items[0].pnl);
    need(r1.items[0].cur==='KRW','기록 통화 '+r1.items[0].cur);
    need(r1.items[0].name==='QA 실현 종목','기록 종목 '+r1.items[0].name);
    var rcard2=qa('#main [data-asset]').filter(function(c){return txt(c).indexOf('QA 실현 종목')>=0;})[0];
    var rv2=await sellOnce(rcard2,5,10000);
    var r2=JSON.parse(localStorage.getItem(realKey)||'{}');
    need((r2.items||[]).length===2,'누적 기록 '+((r2.items||[]).length)+'건(기대 2)');
    q('#msheet [data-close]').click(); await wait(320);
    var rlt=txt(q('#main .pfcard .rl'));
    need(/\+10,000원/.test(rlt),'누적 +10,000원 없음: '+rlt);
    need(/2건/.test(rlt),'2건 표시 없음: '+rlt);
    rec('pass','v9 매도 실현손익 누적 · '+rlt+' (이전 '+prev+')');
  }catch(e){ rec('fail','v9 실현손익 누적',e.message); try{q('#msheet [data-close]').click();}catch(_){} }

  try{
    win.confirm=function(){return true;};
    q('.tab[data-tab="companies"]').click(); await wait(320);
    q('#main .pfcard [data-real]').click(); await wait(340);
    var rrows=qa('#msheet .rrow');
    need(rrows.length===2,'내역 행 '+rrows.length+'개(기대 2)');
    need(txt(rrows[0]).indexOf('QA 실현 종목')>=0,'내역 종목명 없음: '+txt(rrows[0]));
    need(/\+5,000원/.test(txt(rrows[0])),'내역 손익 없음: '+txt(rrows[0]));
    var badr=X.overflowV('#msheet .rrow');
    need(!badr.length,'내역 넘침: '+badr.join(', '));
    qa('#msheet [data-rdel]')[0].click(); await wait(480);
    var r3=JSON.parse(localStorage.getItem(realKey)||'{}');
    need((r3.items||[]).length===1,'행 삭제 후 '+((r3.items||[]).length)+'건(기대 1)');
    need(qa('#msheet .rrow').length===1,'삭제 후 시트 행 '+qa('#msheet .rrow').length+'개');
    rec('pass','v9 실현손익 내역 · 행 삭제');
  }catch(e){ rec('fail','v9 실현손익 내역',e.message); try{q('#msheet [data-close]').click();}catch(_){} }

  /* ---------- 24. v9 · 새로고침 후 유지(계획·실현손익·신호일) ---------- */
  var sigKey='macro_radar_siglog_v1:qa';
  try{
    var logA=JSON.parse(localStorage.getItem(sigKey)||'{}');
    var nOld=Object.keys(logA).length;
    need(nOld>0,'신호 발생일 기록 없음');
    need(Object.keys(logA).every(function(k){ return logA[k]&&/^\d{4}-\d{2}-\d{2}$/.test(logA[k].d||''); }),'신호일 형식 오류');
    var nowS=new Date();
    var todayS=nowS.getFullYear()+'-'+('0'+(nowS.getMonth()+1)).slice(-2)+'-'+('0'+nowS.getDate()).slice(-2);
    need(Object.keys(logA).some(function(k){ return logA[k].d===todayS; }),'오늘 날짜 기록 없음');
    var news1=qa('#main .sig .snew');
    need(news1.length>=1,'오늘 배지 없음');
    need(txt(news1[0]).indexOf('오늘')>=0,'배지 문구: '+txt(news1[0]));
    rec('pass','v9 신호 발생일 기록 · '+nOld+'건 · 오늘 배지 '+news1.length+'개');
  }catch(e){ rec('fail','v9 신호 발생일',e.message); }

  try{
    var logA2=JSON.parse(localStorage.getItem(sigKey)||'{}');
    var nA=Object.keys(logA2).length;
    var oldMap={}; Object.keys(logA2).forEach(function(k){ oldMap[k]=true; });
    /* 어제 걸린 신호로 바꿔 두고, 새로고침 뒤에도 시작일이 유지되는지 본다 */
    var yd=new Date(new Date().getTime()-86400000);
    var ydS=yd.getFullYear()+'-'+('0'+(yd.getMonth()+1)).slice(-2)+'-'+('0'+yd.getDate()).slice(-2);
    var seed={}; Object.keys(logA2).forEach(function(k){ seed[k]={d:ydS,u:ydS}; });
    localStorage.setItem(sigKey, JSON.stringify(seed));
    /* 도감 판정일도 하나만 오래된 날짜로 두고, 새로고침 뒤 복습 우선순위를 검증한다 */
    var stObj=JSON.parse(localStorage.getItem('macro_radar_study_v1:qa')||'{}');
    var doneKeys=Object.keys(stObj).filter(function(k){ return stObj[k]===2; });
    need(doneKeys.length>=1,'완료 카드 없음(복습 필요 시드 불가)');
    var smSeed={}; smSeed[doneKeys[0]]='2026-01-01';
    localStorage.setItem('macro_radar_study_meta_v1:qa', JSON.stringify(smSeed));
    var loadP=new Promise(function(r){ f.addEventListener('load',r,{once:true}); });
    win.location.reload();
    await loadP; await wait(2500);
    X=boot(win); d=X.d; q=X.q; qa=X.qa;
    win.confirm=function(){ return true; };
    q('.tab[data-tab="companies"]').click(); await wait(520);
    var logB=JSON.parse(localStorage.getItem(sigKey)||'{}');
    var kept=Object.keys(logB).filter(function(k){ return logB[k]&&logB[k].d===ydS; }).length;
    /* 기록된 시작일은 덮어쓰지 않는다(새로 생긴 신호의 오늘 날짜는 정상) */
    var overwritten=Object.keys(oldMap).filter(function(k){ return logB[k]&&logB[k].d!==ydS; });
    need(!overwritten.length,'기록된 날짜를 오늘로 덮어씀: '+overwritten.slice(0,2).join(', '));
    need(kept>=1,'보존된 날짜 없음');
    var staleNew=qa('#main .sig .snew').filter(function(em){
      var sk=em.closest('.sig').getAttribute('data-sk');
      return !!oldMap[sk];
    });
    need(!staleNew.length,'지난 날짜 신호에 오늘 배지 '+staleNew.length+'개');
    var planB=JSON.parse(localStorage.getItem(planKey)||'{}');
    need(planB[pid]&&planB[pid].length===3,'새로고침 후 계획 유실');
    var pcB=qa('#main [data-asset]').filter(function(c){return txt(c).indexOf('QA 계획 종목')>=0;})[0];
    need(!!pcB&&/매수 계획/.test(txt(pcB)),'새로고침 후 매수 계획 배지 없음');
    var rlB=txt(q('#main .pfcard .rl'));
    need(/\+5,000원/.test(rlB),'새로고침 후 실현손익 유실: '+rlB);
    rec('pass','v9 새로고침 유지 · 계획 3단 · 실현 +5,000원 · 신호일 보존 '+kept+'건');
  }catch(e){ rec('fail','v9 새로고침 유지',e.message); }

  /* ---------- 24b. v9 · 매수 계획 지우기 · 임시 종목 정리 ---------- */
  try{
    win.confirm=function(){ return true; };
    q('.tab[data-tab="companies"]').click(); await wait(340);
    var pcz=qa('#main [data-asset]').filter(function(c){return txt(c).indexOf('QA 계획 종목')>=0;})[0];
    need(!!pcz,'임시 계획 종목 없음');
    pcz.click(); await wait(380);
    q('#msheet [data-pclear]').click(); await wait(500);
    var pst3=JSON.parse(localStorage.getItem(planKey)||'{}');
    need(!pst3[pid],'계획을 지웠는데 저장값이 남음');
    q('#msheet [data-close]').click(); await wait(300);
    var ptxt2=txt(qa('#main [data-asset]').filter(function(c){return txt(c).indexOf('QA 계획 종목')>=0;})[0]);
    need(ptxt2.indexOf('매수 계획')<0,'계획 지운 뒤 배지가 남음: '+ptxt2.slice(0,120));
    rec('pass','v9 매수 계획 지우기 · 배지 제거');
  }catch(e){ rec('fail','v9 계획 지우기',e.message); try{q('#msheet [data-close]').click();}catch(_){} }

  try{
    win.confirm=function(){ return true; };
    q('.tab[data-tab="companies"]').click(); await wait(300);
    q('#btnEditMode').click(); await wait(320);
    var names=['QA 계획 종목','QA 실현 종목'];
    for(var ni=0;ni<names.length;ni++){
      var dbs=qa('#main [data-del2]').filter(function(b){ return txt(b.closest('.card')).indexOf(names[ni])>=0; })[0];
      if(dbs){ dbs.click(); await wait(360); }
    }
    if(q('#btnEditMode')&&txt(q('#btnEditMode')).indexOf('편집 완료')>=0){ q('#btnEditMode').click(); await wait(300); }
    var left=qa('#main [data-asset]').filter(function(c){ return txt(c).indexOf('QA ')===0; });
    need(!left.length,'임시 종목이 남음: '+left.length);
    rec('pass','v9 임시 종목 정리 · 카드 '+qa('#main [data-asset]').length+'장 복귀');
  }catch(e){ rec('fail','v9 임시 종목 정리',e.message); }

  /* ---------- 25. v9 · 도감 복습 우선순위 · 10장 세션 반복 방지 · 태그 세션 ---------- */
  try{
    q('.tab[data-tab="study"]').click(); await wait(420);
    var hintT=txt(q('#main .sec .hint'));
    need(/복습 필요/.test(hintT),'복습 필요 표시 없음: '+hintT);
    var qb=q('#btnQuizTest');
    need(txt(qb).indexOf('10장')>=0,'10장 버튼 아님: '+txt(qb));
    qb.click(); await wait(450);
    need(/1 \/ 10/.test(txt(q('#msheet .qt-prog'))),'세션 시작 1/10 아님: '+txt(q('#msheet .qt-prog')));
    var mix1=txt(q('#msheet .qt-mix'));
    need(/미학습/.test(mix1)&&/애매/.test(mix1)&&/복습/.test(mix1),'세션 구성 줄 없음: '+mix1);
    var nums1=(mix1.match(/\d+/g)||[]).map(Number);
    need(nums1.length===3&&nums1.reduce(function(a,b){return a+b;},0)===10,'구성 합 10 아님: '+mix1);
    need(nums1[2]>=1,'오래된 완료 카드가 복습으로 잡하지 않음: '+mix1);
    var t1=[], guard1=0;
    while(guard1++<70){
      var g1=qa('#msheet [data-grade]');
      if(g1.length){ var h1=q('#msheet .qt-card h3'); if(h1) t1.push(txt(h1)); g1[2].click(); await wait(45); continue; }
      var nx1=q('#msheet [data-qtnext]');
      if(nx1){ nx1.click(); await wait(45); continue; }
      break;
    }
    need(t1.length===10,'1세션 카드 '+t1.length+'장(기대 10)');
    var moreB=q('#msheet [data-qtmore]');
    need(!!moreB,'다음 10장 버튼 없음');
    moreB.click(); await wait(450);
    need(/1 \/ 10/.test(txt(q('#msheet .qt-prog'))),'2세션 1/10 아님');
    var t2=[], guard2=0;
    while(guard2++<70){
      var g2=qa('#msheet [data-grade]');
      if(g2.length){ var h2=q('#msheet .qt-card h3'); if(h2) t2.push(txt(h2)); g2[2].click(); await wait(45); continue; }
      var nx2=q('#msheet [data-qtnext]');
      if(nx2){ nx2.click(); await wait(45); continue; }
      break;
    }
    need(t2.length===10,'2세션 카드 '+t2.length+'장(기대 10)');
    var dup=t2.filter(function(x){ return t1.indexOf(x)>=0; });
    need(!dup.length,'2세션에서 1세션 카드 반복: '+dup.slice(0,3).join(' / '));
    need(!X.overflowV('#msheet .qt-mix').length,'세션 구성 줄 넘침');
    rec('pass','v9 도감 세션 · '+mix1+' · 2세션 반복 0');
    q('#msheet [data-close]').click(); await wait(320);
  }catch(e){ rec('fail','v9 도감 세션',e.message); try{q('#msheet [data-close]').click();}catch(_){} }

  try{
    q('.tab[data-tab="study"]').click(); await wait(380);
    var tagb=q('#main .sfilter [data-stag="재무"]');
    need(!!tagb,'재무 태그 없음');
    tagb.click(); await wait(380);
    var qb2=q('#btnQuizTest');
    need(txt(qb2).indexOf('2장')>=0,'태그 세션 라벨 '+txt(qb2)+' (재무 2장)');
    qb2.click(); await wait(450);
    var pr2=txt(q('#msheet .qt-prog'));
    need(/1 \/ 2/.test(pr2),'태그 세션 1/2 아님: '+pr2);
    var tg=txt(q('#msheet .qt-card .qtg'));
    need(tg.indexOf('재무')>=0||tg.indexOf(' ')>=0,'태그 카드 표시: '+tg);
    need(/재무/.test(pr2),'세션 머리에 태그 없음: '+pr2);
    rec('pass','v9 태그 10장 필터 · 재무 2장 세션');
    q('#msheet [data-close]').click(); await wait(300);
    q('#main .sfilter [data-stag="전체"]').click(); await wait(320);
  }catch(e){ rec('fail','v9 태그 세션',e.message); try{q('#msheet [data-close]').click();}catch(_){} }

  /* ---------- 26. v9 · 브리핑 다음 정기 브리핑 안내 ---------- */
  try{
    q('.tab[data-tab="briefing"]').click(); await wait(480);
    var bn=q('#main .bnext');
    need(!!bn,'다음 정기 브리핑 블록 없음');
    need(q('#main').firstElementChild===bn,'브리핑 탭 맨 위가 아님');
    var brows=qa('#main .bnext .bnl');
    need(brows.length===2,'다음 브리핑 줄 '+brows.length+'개(기대 2)');
    need(/국내/.test(txt(brows[0]))&&/미국/.test(txt(brows[1])),'국내/미국 라벨 없음: '+txt(bn));
    var reT=/^\d{2}\/\d{2}\(([일월화수목금토])\) \d{2}:\d{2}$/;
    var krT=txt(brows[0].querySelector('.bt')), usT=txt(brows[1].querySelector('.bt'));
    need(reT.test(krT),'국내 시각 형식: '+krT);
    need(reT.test(usT),'미국 시각 형식: '+usT);
    var krW=krT.match(reT)[1], usW=usT.match(reT)[1];
    need('월화수목금'.indexOf(krW)>=0,'국내 브리핑 요일이 평일이 아님: '+krW);
    need('화수목금토'.indexOf(usW)>=0,'미국 브리핑 요일이 화~토가 아님: '+usW);
    need(krT.slice(-5)==='16:00','국내 시각 16:00 아님: '+krT);
    need(usT.slice(-5)==='07:00','미국 시각 07:00 아님: '+usT);
    var krIn=txt(brows[0].querySelector('.bd')), usIn=txt(brows[1].querySelector('.bd'));
    need(/(분|시간|일)/.test(krIn),'국내 남은 시간 없음: '+krIn);
    need(/(분|시간|일)/.test(usIn),'미국 남은 시간 없음: '+usIn);
    need(!X.overflow('#main .bnext').length,'다음 안내 넘침');
    rec('pass','v9 다음 정기 브리핑 · 국내 '+krT+' ('+krIn+') · 미국 '+usT+' ('+usIn+')');
  }catch(e){ rec('fail','v9 다음 정기 브리핑',e.message); }

  /* ---------- 결과 ---------- */
  restoreStorage();
  var sum=document.getElementById('sum');
  sum.innerHTML='<span class="ok">PASS '+R.pass+'</span> · <span class="ng">FAIL '+R.fail+'</span> · <span class="sk">SKIP '+R.skip+'</span> · 폭 '+W+'px';
  document.title='QA '+W+' PASS '+R.pass+' FAIL '+R.fail+' SKIP '+R.skip;
  document.getElementById('log').textContent=R.items.map(function(i){
    return (i.state==='pass'?'✅ ':i.state==='fail'?'❌ ':'⏭ ')+i.name+(i.info?' — '+i.info:'');
  }).join('\n');
  window.__QA=R;
}
run().catch(function(e){
  restoreStorage();
  document.getElementById('sum').textContent='HARNESS ERROR: '+e.message;
  window.__QA={error:String(e&&e.stack||e)};
});
</script>
</body>
</html>
