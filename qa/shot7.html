<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>macro-radar v7 shots</title>
<style>
html,body{margin:0;background:#000;overflow:hidden}
iframe{display:block;border:0;background:#070b11}
</style>
</head>
<body>
<script>
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
var P=new URLSearchParams(location.search);
var S=P.get('s')||'portfolio', W=parseInt(P.get('w')||'390',10), H=parseInt(P.get('h')||'844',10);
var f=document.createElement('iframe');
f.width=W; f.height=H; f.style.width=W+'px'; f.style.height=H+'px';
f.src='../index.html?qa=1&shot='+S+'&t='+Date.now();
document.body.appendChild(f);
document.title='shot '+S+' '+W;
f.addEventListener('load',async function(){
  var d=f.contentDocument, q=function(x){ return d.querySelector(x); };
  var qa=function(x){ return Array.prototype.slice.call(d.querySelectorAll(x)); };
  await wait(1900);
  try{
    if(S==='home'){ window.scrollTo(0,0); }
    else if(S==='portfolio'||S==='light'){
      if(S==='light') q('#btnTheme').click();
      q('.tab[data-tab="companies"]').click(); await wait(500);
      window.scrollTo(0,0);
    }
    else if(S==='pmap'||S==='detail'){
      q('.tab[data-tab="companies"]').click(); await wait(400);
      q('#main [data-asset="gamsung"]').click(); await wait(500);
      if(S==='pmap'){
        var pm=q('#msheet .pmap');
        if(pm) q('#msheet').scrollTop=pm.offsetTop-120;
      }
    }
    else if(S==='qtre'){
      q('.tab[data-tab="study"]').click(); await wait(400);
      q('#btnQuizTest').click(); await wait(400);
      qa('#msheet [data-grade]')[0].click(); await wait(250);
      for(var i=0;i<4;i++){
        var nx=q('#msheet [data-qtnext]'); if(!nx) break;
        nx.click(); await wait(160);
        var g=qa('#msheet [data-grade]'); if(!g.length) break;
        if(q('#msheet .qt-re')) break;
        g[2].click(); await wait(200);
      }
      await wait(250);
    }
    else if(S==='qtdone'){
      q('.tab[data-tab="study"]').click(); await wait(400);
      q('#btnQuizTest').click(); await wait(400);
      var guard=0;
      while(guard++<40){
        var gn=qa('#msheet [data-grade]');
        if(gn.length){ gn[2].click(); await wait(40); continue; }
        var nn=q('#msheet [data-qtnext]');
        if(nn){ nn.click(); await wait(40); continue; }
        break;
      }
    }
  }catch(e){ document.title='ERR '+e.message; }
  await wait(400);
  window.__ready=true;
  document.title='ready '+S+' '+W;
});
</script>
</body>
</html>
