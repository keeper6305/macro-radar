/* 분기·연간 실적: 매출·영업이익 막대 + 영업이익률 선 */
function finChart(fin, mode, key){
  if(!fin) return '';
  var ps=(mode==='a'?fin.annual:fin.quarterly)||[];
  ps=ps.filter(function(p){ return typeof p.revenue==='number'; });
  if(!ps.length) return '';
  var id=chartId(), W=322, H=150, pl=34, pr=26, pt=14, pb=26;
  var pw=W-pl-pr, ph=H-pt-pb;
  var maxRev=Math.max.apply(null, ps.map(function(p){return p.revenue||0;}));
  if(maxRev<=0) maxRev=1;
  var margins=ps.map(function(p){ return (typeof p.margin==='number')?p.margin:null; }).filter(function(v){return v!==null;});
  var maxMar=Math.max.apply(null, margins.concat([5]));
  var mt=niceTicks(0, maxMar, 2); maxMar=mt.hi;
  function Y(v){ return pt+(1-v/maxRev)*ph; }
  function YM(v){ return pt+(1-v/(maxMar||1))*ph; }
  var band=pw/ps.length;
  var bars='', marPath='', labels='', dots='';
  ps.forEach(function(p,i){
    var cx=pl+band*(i+0.5);
    var bw=Math.max(6, Math.min(band*0.58, 26));
    var rh=Math.max(1,(p.revenue||0)/maxRev*ph);
    bars+='<rect class="bar1" x="'+(cx-bw/2).toFixed(2)+'" y="'+(pt+ph-rh).toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+rh.toFixed(2)+'" rx="2"'+(p.consensus?' opacity=".18"':'')+'/>';
    if(typeof p.op==='number'){
      var oh=Math.max(1, Math.abs(p.op)/maxRev*ph);
      if(p.op>=0){
        bars+='<rect class="bar2" x="'+(cx-bw/2).toFixed(2)+'" y="'+(pt+ph-oh).toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+oh.toFixed(2)+'" rx="2"'+(p.consensus?' opacity=".45"':'')+'/>';
      }else{
        var nh=Math.min(oh, ph*0.28);
        bars+='<rect class="barneg" x="'+(cx-bw/2).toFixed(2)+'" y="'+(pt+ph).toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+nh.toFixed(2)+'" rx="2"/>';
      }
    }
    labels+='<text class="bl" x="'+cx.toFixed(2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.label)+'</text>';
  });
  var mpts=[];
  ps.forEach(function(p,i){
    if(typeof p.margin!=='number') return;
    var cx=pl+band*(i+0.5), cy=YM(p.margin);
    mpts.push({x:cx,y:cy,v:p.margin,p:p});
    dots+='<circle class="mpt" cx="'+cx.toFixed(2)+'" cy="'+cy.toFixed(2)+'" r="2.2"/>';
  });
  if(mpts.length>1) marPath='<path class="mline" d="'+mpts.map(function(q,i){return (i?'L':'M')+q.x.toFixed(2)+' '+q.y.toFixed(2);}).join('')+'"/>';
  var ylab='';
  mt.ticks.forEach(function(tv){
    var y=YM(tv);
    ylab+='<text class="ax" x="'+(W-pr+4)+'" y="'+(y+3).toFixed(2)+'">'+esc(nf(tv,0))+'%</text>';
  });
  ylab+='<text class="ax" x="'+(pl-4)+'" y="'+(pt-4)+'" text-anchor="end">'+esc(fin.unit==='십억 달러'?'$B':fin.unit||'')+'</text>';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="매출·영업이익 추이">'+
    '<line class="grid" x1="'+pl+'" y1="'+(pt+ph)+'" x2="'+(W-pr)+'" y2="'+(pt+ph)+'"/>'+
    bars+marPath+dots+labels+ylab+
    '<line class="cross" x1="0" y1="'+pt+'" x2="0" y2="'+(pt+ph)+'" style="display:none"/>'+
    '</svg>';
  S.charts[id]={type:'fin', ps:ps, W:W, H:H, pl:pl, pw:pw, pt:pt, ph:ph, band:band, unit:fin.unit||''};
  return '<div class="chart finchart" data-cid="'+id+'">'+svg+'<div class="ctip"></div>'+
    '<div class="src"><span>'+esc(fin.unit==='십억 달러'?'매출·영업이익(USD)':'매출·영업이익(억 원)')+'</span><span>막대=매출·영업이익, 선=영업이익률</span></div></div>';
}

/* PER·PBR 밴드 게이지 */
function bandGauge(kind, cur, band, extra){
  if(!band||typeof cur!=='number') return '';
  var lo=band.low, hi=band.high;
  var mn=Math.min(lo,cur), mx=Math.max(hi,cur);
  var span=(mx-mn)||1, off=span*0.08; mn-=off; mx+=off;
  function pos(v){ return clamp((v-mn)/((mx-mn)||1)*100); }
  var p=pos(cur), pl=pos(lo), pm=pos(band.mid), ph=pos(hi);
  var where = cur<lo ? '밴드 하단 아래' : (cur>hi ? '밴드 상단 위' : (cur<band.mid?'하단~평균':'평균~상단'));
  var gapToLow = (cur/lo-1)*100;
  var tone = cur<=band.mid ? 'good' : 'warn';
  return '<div class="band">'+
    '<div class="bh"><span>'+esc(kind)+' 밴드'+(extra?' · '+esc(extra):'')+'</span><b>'+nf(cur,2)+'</b></div>'+
    '<div class="btr"><i class="needle" style="left:'+p.toFixed(2)+'%"></i>'+
      '<i class="bmk" style="left:'+pl.toFixed(2)+'%"></i><i class="bmk" style="left:'+ph.toFixed(2)+'%"></i></div>'+
    '<div class="bl"><span>하단 '+nf(lo,2)+'</span><span>평균 '+nf(typeof band.avg==='number'?band.avg:band.mid,2)+'</span><span>상단 '+nf(hi,2)+'</span></div>'+
    '<div class="bn '+tone+'">현재 '+esc(where)+' · 하단 대비 '+sgn(gapToLow,1)+'</div>'+
  '</div>';
}

/* PER·PBR 밴드 차트: 연말 실적 기준 배수 + 현재 위치 */
function bandSeries(a,kind){
  var key=(kind==='PER')?'per':'pbr';
  var s=[];
  (((a.fin||{}).annual)||[]).forEach(function(p){
    if(typeof p[key]==='number') s.push({d:p.label,v:p[key]});
  });
  var cur=a[key];
  if(cur&&typeof cur.cur==='number') s.push({d:'현재',v:cur.cur});
  return s;
}
function bandBlock(a,kind){
  var cur=a[(kind==='PER')?'per':'pbr'];
  if(!cur||!cur.band||typeof cur.cur!=='number') return '';
  var h='';
  var ps=bandSeries(a,kind);
  if(ps.length>2){
    h+=lineChart({series:ps,name:kind+' 밴드',h:104,dec:2,
      refs:[{value:cur.band.low,label:'하단',color:'var(--good)'},
            {value:cur.band.mid,label:'평균',color:'var(--mu)'},
            {value:cur.band.high,label:'상단',color:'var(--bad)'}],
      src:(kind==='PER'?'연말 실적 기준 PER':'연말 실적 기준 PBR')+' · 현재 포함',
      freq:'연간 시점 기준'});
  }
  h+=bandGauge(kind,cur.cur,cur.band,kind==='PER'?(cur.eps?('EPS '+nf(cur.eps,0)):''):(cur.bps?('BPS '+nf(cur.bps,0)):''));
  return h;
}

/* 시계열 바인딩 (탭/터치/호버 툴팁) */
function bindCharts(root){
  root=root||document;
  Array.prototype.forEach.call(root.querySelectorAll('.chart[data-cid]'),function(box){
    var c=S.charts[box.getAttribute('data-cid')];
    if(!c) return;
    var svg=box.querySelector('svg');
    var cross=svg.querySelector('.cross');
    var hdot=svg.querySelector('.hdot');
    var tip=box.querySelector('.ctip');
    if(!svg||!tip) return;
    var hideT=null;
    box.style.touchAction='pan-y';
    function show(ev){
      clearTimeout(hideT);
      var r=svg.getBoundingClientRect();
      if(!r.width) return;
      var vx=(ev.clientX-r.left)/r.width*c.W;
      var txt='', x=0;
      if(c.type==='line'){
        var i=Math.round((vx-c.pl)/(c.pw||1)*(c.s.length-1));
        i=Math.max(0,Math.min(c.s.length-1,i));
        var p=c.s[i];
        x=c.pl+(c.s.length===1?c.pw/2:(i/(c.s.length-1))*c.pw);
        var y=c.pt+(1-(p.v-c.mn)/(((c.mx-c.mn)||1)))*c.ph;
        var pv=(i>0)?c.s[i-1]:null;
        var ch=(pv&&pv.v)?((p.v/pv.v-1)*100):null;
        txt=dLong(p.d)+' · '+exact(p.v)+(c.unit||'')+(ch!=null?' · 직전 대비 '+sgn(ch,2):'');
        if(hdot){ hdot.setAttribute('cx',x.toFixed(2)); hdot.setAttribute('cy',(isFinite(y)?y:c.pt).toFixed(2)); hdot.style.display=''; }
        tip.style.top=Math.max(15,((isFinite(y)?y:c.pt)/c.H)*100).toFixed(1)+'%';
      }else{
        var bi=Math.floor((vx-c.pl)/c.band);
        bi=Math.max(0,Math.min(c.ps.length-1,bi));
        var q=c.ps[bi];
        x=c.pl+c.band*(bi+0.5);
        txt=q.label+' · 매출 '+fmtMoney(q.revenue,c.unit)+
            (typeof q.op==='number'?' · 영업이익 '+fmtMoney(q.op,c.unit):'')+
            (typeof q.margin==='number'?' ('+nf(q.margin,1)+'%)':'')+(q.consensus?' · 컨센서스':'');
        tip.style.top='12%';
      }
      cross.setAttribute('x1',x.toFixed(2)); cross.setAttribute('x2',x.toFixed(2)); cross.style.display='';
      tip.textContent=txt;
      tip.style.left=Math.max(16,Math.min(84,(x/c.W)*100)).toFixed(1)+'%';
      tip.classList.add('on');
    }
    function hide(){
      clearTimeout(hideT);
      tip.classList.remove('on');
      if(cross) cross.style.display='none';
      if(hdot) hdot.style.display='none';
    }
    svg.addEventListener('pointerdown',function(ev){ ev.stopPropagation(); show(ev); });
    svg.addEventListener('pointermove',function(ev){
      if(ev.pointerType==='mouse'||ev.buttons||ev.pointerType==='touch'){ ev.stopPropagation(); show(ev); }
    });
    /* 손을 떼도 잠시 숫자를 남겨 모바일에서 읽을 틈을 준다 */
    svg.addEventListener('pointerup',function(ev){ show(ev); clearTimeout(hideT); hideT=setTimeout(hide,2600); });
    svg.addEventListener('pointerleave',hide);
    svg.addEventListener('pointercancel',hide);
    /* 차트 터치는 툴팁만 — 카드 상세 열기로 번지지 않게 */
    box.addEventListener('click',function(ev){ ev.stopPropagation(); });
    box.addEventListener('keydown',function(ev){ ev.stopPropagation(); });
  });
}

/* ---------- gauge (지표 밴드) ---------- */
function gauge(row){
  var sc=row.scale||{min:0,max:100,decimals:0,unit:''};
  var min=sc.min, max=sc.max, span=(max-min)||1;
  var zones=(row.zones||[]).map(function(z){
    var l=clamp((z.from-min)/span*100);
    var w=clamp((z.to-min)/span*100)-l;
    if(w<=0) return '';
    return '<span class="zone lv-'+z.level+'" style="left:'+l.toFixed(2)+'%;width:'+w.toFixed(2)+'%"></span>';
  }).join('');
  var mks=(row.markers||[]).map(function(m){
    var p=clamp((m.at-min)/span*100);
    var lp=Math.max(8,Math.min(92,p));
    return '<span class="tick" style="left:'+p.toFixed(2)+'%"></span>'+
           '<span class="tick-lb" style="left:'+lp.toFixed(2)+'%">'+esc(m.label)+'</span>';
  }).join('');
  var hasV=(typeof row.value==='number');
  var need=hasV?'<span class="needle" style="left:'+clamp((row.value-min)/span*100).toFixed(2)+'%"></span>':'';
  var u=sc.unit||'';
  function lab(v){ var d=(Math.abs(v-Math.round(v))<1e-9)?0:(sc.decimals||0);
    return v.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:d})+u; }
  return '<div class="gauge">'+need+'<div class="track">'+zones+'</div>'+
         (mks?'<div class="mks">'+mks+'</div>':'')+'</div>'+
         '<div class="scale"><span>'+esc(lab(min))+'</span><span>'+esc(lab(max))+'</span></div>';
}

function badge(signal,text){
  var cls=signal==='red'?'b-red':(signal==='amber'?'b-amber':(signal==='green'?'b-green':'b-mute'));
  var em=signal==='red'?'🔴 ':signal==='amber'?'🟡 ':signal==='green'?'🟢 ':'';
  return '<span class="badge '+cls+'">'+em+esc(text)+'</span>';
}
function sdot(s){ return '<span class="sdot s-'+(s||'amber')+'"></span>'; }

/* ---------- v6: 거시 리본 · 보유 요약 · 가격 지도 ---------- */
function renderRibbon(){
  var rb=$id('ribbon'); if(!rb) return;

  if(!rg){ rb.hidden=true; return; }
  var met=Math.max(0,Math.min(rg.reverseTotal||0,rg.reverseCount||0)), tot=rg.reverseTotal||0;
  var dots='';
  for(var i=0;i<tot;i++) dots+='<i class="rdot'+(i<met?' on':'')+'"></i>';

function priceFmt(a,v){
  if(typeof v!=='number'||!isFinite(v)) return '–';
  var mk=String((a&&a.market)||'').toUpperCase();
  if(mk==='CRYPTO') return '$'+nf(v,v<100?2:0);
  if(mk==='NASDAQ'||mk==='NYSE'||mk==='US') return '$'+nf(v,2);
  return nf(v,(Math.abs(v-Math.round(v))<1e-9)?0:1)+'원';
}
function holdReturn(a){
  if(!a||typeof a.price!=='number'||typeof a.avg!=='number'||!a.avg) return null;
  return (a.price/a.avg-1)*100;
}
/* ---------- v7: 보유 평가손익 ---------- */
/* 통화: 국내 상장은 원, 해외·크립토는 달러 */
function assetCur(a){
  var mk=String((a&&a.market)||'').toUpperCase();
  return (mk==='CRYPTO'||mk==='NASDAQ'||mk==='NYSE'||mk==='US')?'USD':'KRW';
}
/* 원/달러 환율(지표 fx 행) — 합산 환산에만 쓴다 */
function fxRate(){
  var ind=((S.data&&S.data.indicators)||[]).filter(function(x){return x.id==='fx';})[0];
  var row=ind&&(ind.rows||[]).filter(function(r){return /원\/달러/.test(String(r.label||''));})[0];
  var v=row&&row.value;
  return (typeof v==='number'&&v>100&&v<10000)?v:null;
}
/* 자유 텍스트 수량 호환: '43주 보유' · '2주 보유 · 잔여 $633 대기' · '0.5 BTC' */
function parseQty(a){
  if(typeof a.qtyNum==='number'&&a.qtyNum>0) return a.qtyNum;
  var t=String((a&&a.qty)||'');
  var m=t.match(/(\d[\d,]*(?:\.\d+)?)\s*(주|개|코인|BTC|ETH)/i);
  if(!m) return null;
  var n=parseFloat(String(m[1]).replace(/,/g,''));
  return (isFinite(n)&&n>0)?n:null;
}
function money(v,cur,d){
  if(typeof v!=='number'||!isFinite(v)) return '–';
  var dg=(typeof d==='number')?d:(cur==='USD'?2:0);
  var s=Math.abs(v).toLocaleString('ko-KR',{minimumFractionDigits:dg,maximumFractionDigits:dg});
  return (v<0?'-':'')+(cur==='USD'?'$':'')+s+(cur==='USD'?'':'원');
}
function moneyS(v,cur,d){
  if(typeof v!=='number'||!isFinite(v)) return '–';
  return (v>0?'+':(v<0?'-':''))+money(Math.abs(v),cur,d);
}
/* 수량·평단(또는 매입금액)이 숫자로 있는 보유만 평가액을 계산한다.
   계산할 수 없는 보유는 miss로 모아 '수량·평단 입력' 안내를 띄운다. */
function holdingsOf(){
  var held=[], miss=[];
  assets().forEach(function(a){
    if(typeof a.price!=='number') return;
    var q=parseQty(a), cur=assetCur(a);
    var avg=(typeof a.avg==='number'&&a.avg>0)?a.avg:null;
    var inv=(typeof a.invested==='number'&&a.invested>0)?a.invested:null;
    var cost=(q>0)?(inv||(avg?avg*q:null)):null;
    if(q>0&&cost>0){
      var ev=a.price*q;
      held.push({a:a,q:q,cur:cur,cost:cost,avg:avg||(cost/q),evalAmt:ev,pnl:ev-cost,pct:(ev/cost-1)*100});
    }else{
      var t=String(a.qty||'');
      if(!/미보유|관심/.test(t)&&/(\d|보유|매수)/.test(t)) miss.push(a);
    }
  });
  return {held:held,miss:miss};
}
function pfMissHTML(miss){
  return (miss||[]).map(function(a){
    return '<div class="pfmiss"><span>'+esc(a.name)+' · '+esc(String(a.qty||''))+
      ' — 수량·평단을 넣으면 평가금액이 계산됩니다</span>'+
      '<button class="btn" data-edit="'+esc(a.id)+'">입력</button></div>';
  }).join('');
}
function pfDir(v){ return dirClass(v>0?'up':(v<0?'down':'flat')); }
/* 숫자 보유가 있으면 평가금액·평가손익 카드, 없으면 기존 평단 대비 카드로 폴백 */
function portfolioCard(){
  var P=holdingsOf();
  if(!P.held.length) return portfolioAvgCard(P.miss);
  var fx=fxRate();
  var gK=P.held.filter(function(h){return h.cur==='KRW';});
  var gU=P.held.filter(function(h){return h.cur==='USD';});
  function sum(list,k){ return list.reduce(function(s,h){return s+h[k];},0); }
  var eK=sum(gK,'evalAmt'), pK=sum(gK,'pnl');
  var eU=sum(gU,'evalAmt'), pU=sum(gU,'pnl');
  var both=gK.length>0&&gU.length>0;
  var combE=(both&&fx!=null)?(eK+eU*fx):null;
  var combP=(both&&fx!=null)?(pK+pU*fx):null;
  var combPct=null;
  if(combP!=null&&combE-combP>0) combPct=combP/(combE-combP)*100;
  var big,bigCur,bigPct;
  if(combP!=null){ big=combP; bigCur='KRW'; bigPct=combPct; }
  else if(both&&gK.length){ big=pK; bigCur='KRW'; bigPct=(eK-pK)>0?pK/(eK-pK)*100:null; }
  else if(both){ big=pU; bigCur='USD'; bigPct=(eU-pU)>0?pU/(eU-pU)*100:null; }
  else if(gK.length){ big=pK; bigCur='KRW'; bigPct=(eK-pK)>0?pK/(eK-pK)*100:null; }
  else { big=pU; bigCur='USD'; bigPct=(eU-pU)>0?pU/(eU-pU)*100:null; }

  var sub;
  if(combE!=null){
    sub='평가금액 '+nf(Math.round(combE),0)+'원 환산 · 환율 '+nf(fx,2)+'원';
  }else if(both){
    sub='통화별 평가 — 환율 미확인으로 합산하지 않습니다';
  }else{
    sub='보유 '+P.held.length+'종목 · 평가금액 '+money(combE!=null?combE:(gK.length?eK:eU),bigCur==='KRW'?'KRW':(gK.length?'KRW':'USD'))+
        ' · 평단 대비 '+sgn(bigPct,1);
  }
  var curLines='';
  if(both){
    curLines='<div class="pfcur">'+
      pfcLine('원화',eK,pK,'KRW')+pfcLine('달러',eU,pU,'USD')+'</div>';
  }
  var totW=(combE!=null)?combE:null;
  var rows=P.held.slice().sort(function(a,b){
    var wa=(fx!=null&&a.cur==='USD')?a.evalAmt*fx:a.evalAmt;
    var wb=(fx!=null&&b.cur==='USD')?b.evalAmt*fx:b.evalAmt;
    return wb-wa;
  }).map(function(h){
    var krwEq=(fx!=null&&h.cur==='USD')?h.evalAmt*fx:h.evalAmt;
    /* 환율을 모르면 통화별로 비중을 따로 계산한다 */
    var denom=(totW!=null)?totW:(h.cur==='KRW'?eK:eU);
    var w=(denom>0)?((totW!=null?krwEq:h.evalAmt)/denom*100):0;
    var qtyTxt=(h.cur==='USD'&&String(h.a.market||'').toUpperCase()==='CRYPTO')
      ?nf(h.q,h.q%1?3:0)+'개'
      :nf(h.q,h.q%1?2:0)+'주';
    /* v8: 보유 행에서도 손절선 위반·임박만 짧게 표시 (v9: 매수 계획 도달도) */
    var al=assetSignals(h.a).alerts;
    var sb=al.filter(function(x){return x.c==='bad';})[0];
    var sw=al.filter(function(x){return x.c==='warn'&&/손절/.test(x.t);})[0];
    var sp=al.filter(function(x){return x.c==='plan';})[0];
    var flag='';
    if(sb) flag='<span class="pfsig bad">⚠ 손절선 하회</span>';
    else if(sw) flag='<span class="pfsig warn">⚠ 손절선 근접</span>';
    else if(sp) flag='<span class="pfsig plan">● 매수 계획</span>';
    return '<div class="pfrow"><span class="pfn">'+esc(h.a.name)+'<i class="pfq">'+qtyTxt+'</i></span>'+
      '<span class="pfr '+pfDir(h.pnl)+'">'+moneyS(h.pnl,h.cur)+'</span>'+
      '<span class="pfs">'+flag+'평가 <b>'+money(h.evalAmt,h.cur)+'</b> · 평단 '+money(h.avg,h.cur,(h.cur==='USD'?2:1))+
        ' · 평단 대비 '+sgn(h.pct,1)+'</span>'+
      '<div class="pfbar" role="img" aria-label="'+esc(h.a.name+' 비중 '+nf(w,0)+'%')+'" title="비중 '+nf(w,0)+'%">'+
        '<i class="w" style="left:0;width:'+Math.min(100,Math.max(2,w||2)).toFixed(1)+'%"></i></div></div>';
  }).join('');
  return '<article class="card pfcard">'+
    '<div class="pfh"><span class="t">포트폴리오 평가손익</span>'+
      '<span class="vr"><span class="v '+pfDir(big)+'">'+moneyS(big,bigCur)+'</span>'+realChipHTML()+'</span></div>'+

function pfcLine(label,ev,pnl,cur){

/* 폴백: 숫자 수량이 없을 때의 기존 평단 대비 수익률 카드(0% 기준 양방향 막대) */
function portfolioAvgCard(miss){
  var hs=assets().filter(function(a){ return holdReturn(a)!==null; });
  if(!hs.length){
    if(!miss||!miss.length) return '';
    return '<article class="card pfcard">'+
      '<div class="pfh"><span class="t">포트폴리오 평가손익</span>'+
        '<span class="vr"><span class="v">–</span>'+realChipHTML()+'</span></div>'+
      '<div class="pfsub">보유 수량·평단을 넣으면 평가금액과 평가손익이 표시됩니다</div>'+
      pfMissHTML(miss)+'</article>';
  }
  var rs=hs.map(holdReturn);
  var up=rs.filter(function(v){return v>0.05;}).length;
  var dn=rs.filter(function(v){return v<-0.05;}).length;
  var avg=rs.reduce(function(s,v){return s+v;},0)/rs.length;
  var maxAbs=Math.max.apply(null,rs.map(Math.abs));
  var scale=maxAbs<=5?Math.max(1,Math.ceil(maxAbs)):(maxAbs<=10?5:Math.ceil(maxAbs/5)*5);
  var rows=hs.map(function(a,i){
    var r=rs[i];
    var w=Math.min(50,Math.abs(r)/scale*50);
    var cls=r>0.05?'up':(r<-0.05?'down':'flat');
    var style=cls==='up'?('left:50%;width:'+w.toFixed(1)+'%'):
              (cls==='down'?('left:'+(50-w).toFixed(1)+'%;width:'+w.toFixed(1)+'%'):'');
    return '<div class="pfrow"><span class="pfn">'+esc(a.name)+'</span>'+
      '<span class="pfr '+dirClass(r>0.05?'up':(r<-0.05?'down':'flat'))+'">'+sgn(r,1)+'</span>'+
      '<span class="pfs">'+esc(priceText(a))+' · 평단 '+esc(priceFmt(a,a.avg))+'</span>'+
      '<div class="pfbar" role="img" aria-label="'+esc(a.name+' 평단 대비 '+sgn(r,1))+'" title="평단 대비 '+sgn(r,1)+'">'+
        '<span class="mid"></span>'+(cls==='flat'?'<i class="flat"></i>':'<i class="'+cls+'" style="'+style+'"></i>')+
      '</div></div>';
  }).join('');
  return '<article class="card pfcard">'+
    '<div class="pfh"><span class="t">평단 대비 수익률</span>'+
      '<span class="vr"><span class="v '+dirClass(avg>0.05?'up':(avg<-0.05?'down':'flat'))+'">'+sgn(avg,1)+'</span>'+realChipHTML()+'</span></div>'+
    '<div class="pfsub">보유 '+hs.length+'종목 · 단순평균 · 상승 '+up+' · 하락 '+dn+' · 막대 양끝 ±'+scale+'%</div>'+
    rows+pfMissHTML(miss)+'</article>';
}
/* 상세 시트의 가격 지도: 손절 · 평단 · 현재 · 1차 · 2차 목표 구간을 한 줄에.
   현재~최종 목표를 한 덩어리로 칠하지 않고, 목표별 '구간(zone)'과 '연결 구간(conn)'을 나눈다. */
function pmFmt(a,v){
  if(typeof v!=='number'||!isFinite(v)) return '–';
  if(typeof a.barValue==='number'&&isFinite(a.barValue)){
    var bu=(a.barUnit==='$')?'$':'';
    return bu+bigNum(v)+(bu?'':'원');
  }
  return priceFmt(a,v);
}
function priceMap(a){
  if(!a||typeof a.price!=='number') return '';
  var tgs=(a.targets||[]).filter(function(t){ return typeof t.from==='number'; });
  if(!(typeof a.stop==='number'||typeof a.avg==='number'||tgs.length)) return '';
  /* 표시 기준은 카드 밴드와 같은 barValue(있으면 그 통화: ETH는 원) */
  var base=(typeof a.barValue==='number'&&isFinite(a.barValue))?a.barValue:a.price;
  var pts=[];
  if(typeof a.stop==='number') pts.push({v:a.stop,label:'손절',cls:'stp',color:'var(--bad)'});
  if(typeof a.avg==='number') pts.push({v:a.avg,label:'평단',cls:'avg',color:'var(--warn)'});
  pts.push({v:base,label:'현재',cls:'cur',color:'var(--tx)'});
  var scale=[base];
  if(typeof a.stop==='number') scale.push(a.stop);
  if(typeof a.avg==='number') scale.push(a.avg);
  tgs.forEach(function(t){ scale.push(t.from); if(typeof t.to==='number') scale.push(t.to); });
  var lo=Math.min.apply(null,scale), hi=Math.max.apply(null,scale);
  var pad=(hi-lo)*0.08||Math.max(1,Math.abs(hi)*0.05); lo-=pad; hi+=pad;
  function pos(v){ return clamp((v-lo)/((hi-lo)||1)*100); }
  function tEnd(t){ return (typeof t.to==='number'&&t.to>t.from)?t.to:t.from; }
  var segs='';
  var stp=pts.filter(function(p){return p.cls==='stp';})[0];
  if(stp){
    var x1=pos(stp.v), x2=pos(base);
    segs+='<span class="pmseg dn" style="left:'+Math.min(x1,x2).toFixed(2)+'%;width:'+Math.abs(x2-x1).toFixed(2)+'%"></span>';
  }
  /* 현재 → 1차 → 2차: 사이는 옅은 연결선, 목표 구간은 진한 블록 */
  var from=base;
  tgs.forEach(function(t,j){
    var to=tEnd(t);
    if(t.from>from+1e-9){
      var c1=pos(from), c2=pos(t.from);
      segs+='<span class="pmseg conn" style="left:'+Math.min(c1,c2).toFixed(2)+'%;width:'+Math.abs(c2-c1).toFixed(2)+'%"></span>';
    }
    var z1=pos(t.from), z2=pos(to);
    segs+='<span class="pmzone'+(j===1?' z2':(j>=2?' z3':''))+'" style="left:'+Math.min(z1,z2).toFixed(2)+'%;width:'+Math.max(0.9,Math.abs(z2-z1)).toFixed(2)+'%"></span>';
    from=Math.max(from,to);
    pts.push({v:t.from,label:t.label,cls:'tgt',color:'var(--good)'});
  });
  var marks=pts.map(function(p){
    return '<i class="pmm '+p.cls+'" style="left:'+pos(p.v).toFixed(2)+'%" title="'+esc(p.label+' '+pmFmt(a,p.v))+'"></i>';
  }).join('');
  /* 라벨: 목표는 구간 가운데, 나머지는 가격 위치. 가까우면 두 줄로 나눠 겹침을 푼다 */
  var labs=[];
  pts.forEach(function(p){
    if(p.cls==='tgt'){
      var t=tgs.filter(function(x){return x.label===p.label;})[0]||{};
      labs.push({v:(t.from+tEnd(t))/2,label:p.label,zl:true});
    }else labs.push({v:p.v,label:p.label});
  });
  labs.sort(function(x,y){ return x.v-y.v; });
  var last=-99, row=0, ticks='';
  labs.forEach(function(p){
    var q=pos(p.v);
    row=(q-last<13)?(row?0:1):0;
    last=q;
    q=Math.max(4,Math.min(96,q));
    ticks+='<span class="'+(row?'r2 ':'')+(p.zl?'zl':'')+'" style="left:'+q.toFixed(1)+'%">'+esc(p.label)+'</span>';
  });
  var legItems=[];
  if(typeof a.stop==='number') legItems.push({t:'손절',b:pmFmt(a,a.stop),pct:(a.stop/base-1)*100,color:'var(--bad)'});
  if(typeof a.avg==='number') legItems.push({t:'평단',b:pmFmt(a,a.avg),pct:(base/a.avg-1)*100,color:'var(--warn)'});
  legItems.push({t:'현재',b:pmFmt(a,base),pct:null,color:'var(--tx)'});
  tgs.forEach(function(t,j){
    var to=tEnd(t);
    var prev=(j===0)?base:(typeof tgs[j-1].to==='number'?tgs[j-1].to:tgs[j-1].from);
    legItems.push({t:t.label,b:pmFmt(a,t.from)+(to!==t.from?'~'+pmFmt(a,to):''),
      pct:(t.from/prev-1)*100, pctLabel:(j===0?'':'1차 대비 '), color:'var(--good)'});
  });
  var leg=legItems.map(function(p){
    return '<div><i style="background:'+p.color+'"></i>'+esc(p.t)+'<b>'+esc(p.b)+'</b>'+
      (p.pct==null?'':'<span class="pct">'+(p.pctLabel||'')+sgn(p.pct,1)+'</span>')+'</div>';
  }).join('');
  var note='';
  if(tgs.length>1){
    var base2=tgs[0].from;
    var all2=tgs.map(function(t){
      return t.label+' '+sgn((t.from/base-1)*100,1);
    }).join(' · ');
    var step=(tgs[1].from/base2-1)*100;
    note='<div class="pmnote">분할 익절 · '+all2+' (현재가 기준) · 1차→2차 '+sgn(step,1)+'</div>';
  }else if(tgs.length===1){
    note='<div class="pmnote">목표 구간 '+pmFmt(a,tgs[0].from)+' 도달 시 '+sgn((tgs[0].from/base-1)*100,1)+'</div>';
  }
  return '<div class="pmap'+(tgs.length?' tgts':'')+'"><div class="pmbar">'+segs+marks+'</div>'+
    '<div class="pmticks">'+ticks+'</div><div class="pmleg">'+leg+'</div>'+note+'</div>';
}
/* ---------- v8: 분할 매수·매도 평단 시뮬레이터 (저장 전 미리보기) ---------- */
function simCur(a){
  if(String(a.barUnit||'')==='$') return 'USD';
  if(typeof a.barValue==='number') return 'KRW';
  return assetCur(a);
}
function simQtyUnit(a){
  if(String(a.market||'').toUpperCase()==='CRYPTO') return '개';
  return '주';
}
function simMoney(a,v){
  if(typeof v!=='number'||!isFinite(v)) return '–';
  var usd=simCur(a)==='USD';
  var d=usd?2:0;
  var s=Math.abs(v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
  return (v<0?'-':'')+(usd?'$':'')+s+(usd?'':'원');
}
function simMoneyS(a,v){
  if(typeof v!=='number'||!isFinite(v)) return '–';
  return (v>0?'+':(v<0?'-':''))+simMoney(a,Math.abs(v));
}
function simNum(v){
  var n=parseFloat(String(v==null?'':v).replace(/[,\s원$주개코인]/g,''));
  return isFinite(n)?n:NaN;
}
function simGet(a){
  if(!S.sim||S.sim.id!==a.id){
    var q=parseQty(a), base=sigBase(a);
    var step=q?(q*0.1):1;
    step=(step>=1)?Math.round(step):Math.round(step*1000)/1000;
    if(!(step>0)) step=1;
    S.sim={id:a.id,mode:'buy',qty:String(step),px:String(base==null?'':Math.round(base*100)/100)};
  }
  return S.sim;
}
/* 수량·평단 계산은 카드와 같은 bar 단위(ETH는 원화)로 하고,
   기록(localStorage)에는 시세 통화로 되돌려 쓴다. */
function simCalc(a){
  var st=simGet(a), base=sigBase(a);
  var px=simNum(st.px), add=simNum(st.qty);
  var r={st:st,base:base,ok:false};
  if(base==null){ r.msg='현재가가 없어 계산할 수 없습니다. 종목을 수정해 현재가를 넣어 주세요.'; return r; }
  if(!(px>0)){ r.msg='단가를 입력하세요.'; return r; }
  if(!(add>0)){ r.msg='수량을 입력하세요.'; return r; }
  var q=parseQty(a);
  var avg=(typeof a.avg==='number'&&a.avg>0)?a.avg:null;
  var inv=(typeof a.invested==='number'&&a.invested>0)?a.invested:null;
  var toB=(a.price>0)?(base/a.price):1;
  var cost=(q>0)?(inv!=null?inv*toB:(avg?avg*toB*q:null)):null;
  var avgB=(avg!=null)?avg*toB:null;
  r.q=q; r.avg=avgB; r.cost=cost; r.toB=toB; r.px=px;
  if(st.mode==='sell'){
    if(!q||!(q>0)){ r.msg='보유 수량이 없어 매도를 계산할 수 없습니다. 매수로 시험해 보세요.'; return r; }
    if(add>q){ r.msg='보유 '+nf(q,q%1?3:0)+simQtyUnit(a)+'보다 많이 매도할 수 없습니다.'; return r; }
    r.q2=q-add;
    r.avg2=avgB;
    r.cost2=(cost!=null)?(cost-((avgB!=null?avgB:cost/q)*add)):null;
    r.realized=(avgB!=null)?(px-avgB)*add:null;
  }else{
    r.q2=(q||0)+add;
    r.cost2=((cost!=null?cost:0)+px*add);
    r.avg2=r.cost2/r.q2;
  }
  r.pnlNew=(r.cost2!=null)?(base*r.q2-r.cost2):null;
  r.pnlOld=(q>0&&cost!=null)?(base*q-cost):null;
  r.dPnl=(r.pnlNew!=null&&r.pnlOld!=null)?(r.pnlNew-r.pnlOld):null;
  r.beGap=(r.avg2!=null)?(r.avg2/base-1)*100:null;
  var P=holdingsOf(), fx=fxRate(), cur=simCur(a);
  var conv=(cur==='USD'&&fx?fx:1);
  var tot=0, mine=null;
  P.held.forEach(function(h){
    var w=(fx!=null&&h.cur==='USD')?h.evalAmt*fx:h.evalAmt;
    tot+=w;
    if(h.a.id===a.id) mine=w;
  });
  if(mine!=null&&tot>0){
    var delta=(r.q2-q)*base*conv;
    if((tot+delta)>0){
      r.wOld=mine/tot*100;
      r.wNew=(mine+delta)/(tot+delta)*100;
    }
  }else if(tot>0&&st.mode==='buy'){
    var addK=add*base*conv;
    r.wOld=0; r.wNew=addK/(tot+addK)*100;
  }
  r.ok=true;
  return r;
}
function simResHTML(a){
  var r=simCalc(a);
  if(!r.ok) return '<div class="simerr">'+esc(r.msg||'입력값을 확인하세요.')+'</div>';
  var unit=simQtyUnit(a), buy=(r.st.mode==='buy');
  function qf(v){ return nf(v,Math.abs(v%1)>1e-9?3:0); }
  function row(k,v,cls,em){
    return '<div class="simr"><span>'+esc(k)+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+v+(em?'<em>'+em+'</em>':'')+'</b></div>';
  }
  var rows=[];
  if(buy){
    var dv=(r.avg!=null)?(r.avg2/r.avg-1)*100:null;
    rows.push(row('새 평단',simMoney(a,r.avg2),(dv==null?'':(dv<-0.005?'good':(dv>0.005?'warn':''))),
      dv==null?'신규':sgn(dv,2)+'p'));
    rows.push(row('총 수량',qf(r.q2)+unit,'',(r.q?('+'+qf(r.q2-r.q)):'')));
    rows.push(row('총 투자금',simMoney(a,r.cost2),'',(r.cost!=null?('+'+simMoney(a,r.cost2-r.cost)):'')));
     rows.push(row('평가손익',simMoneyS(a,r.pnlNew),(r.pnlNew==null?'':(r.pnlNew>=0?'up':'down')),
      (r.dPnl!=null?('Δ '+simMoneyS(a,r.dPnl)):'')));
  }else{
    rows.push(row('실현손익',simMoneyS(a,r.realized),(r.realized==null?'':(r.realized>=0?'up':'down')),
      (r.realized==null?'평단 미입력':'')));
    rows.push(row('남은 수량',qf(r.q2)+unit,'','-' + qf(r.q-r.q2)));
    rows.push(row('남은 평단',simMoney(a,r.avg2),'',''));
    rows.push(row('남은 평가손익',simMoneyS(a,r.pnlNew),(r.pnlNew==null?'':(r.pnlNew>=0?'up':'down')),''));
  }
  rows.push(row('포트폴리오 비중',(r.wOld!=null?(nf(r.wOld,1)+'% → '+nf(r.wNew,1)+'%'):'–'),'',
    (r.wOld!=null?(((r.wNew-r.wOld)>=0?'+':'')+nf(r.wNew-r.wOld,1)+'p'):'수량 미입력')));
  var sub='';
  if(buy){
    sub='본전가 '+simMoney(a,r.avg2)+(r.beGap==null?'':(r.beGap>0.05?' · 현재가에서 +'+nf(r.beGap,1)+'%':(r.beGap<-0.05?' · 이미 '+nf(-r.beGap,1)+'% 위':'')))
      +' · 평가금액 '+simMoney(a,r.base*r.q2);
  }else{
    sub='남은 평가금액 '+simMoney(a,r.base*r.q2)+(r.realized!=null?' · 매도 대금 '+simMoney(a,r.px*simNum(r.st.qty)):'');
  }
  return rows.join('')+'<div class="simsub">'+esc(sub)+'</div>'+
    '<div class="simcta"><button class="btn" type="button" data-simreset="1">초기화</button>'+
    '<button class="btn pri" type="button" data-simapply="1">기록에 반영</button></div>';
}
function simHTML(a){

    '<div class="finseg" id="simmode"><button type="button" data-simmode="buy" class="'+(st.mode==='buy'?'on':'')+'">매수</button>'+

function simRefresh(a){

function simApply(a){

  if(r.avg2==null||r.cost2==null){

    return;
  }
  var toB=r.toB||1, unit=simQtyUnit(a);
  var q2=Math.round(r.q2*1000)/1000;
  var avgQ=Math.round((r.avg2/toB)*100)/100;
  var costQ=Math.round((r.cost2/toB)*100)/100;
  var sell=(r.st.mode==='sell');

/* 종목 탭 비트코인/이더리움 등 크립토는 지표 탭 값과 동일한 스냅샷을 쓰게 맞춘다.
   (지표·종목이 서로 다른 날 숫자를 보여주는 불일치 제거 · 실시간 성공 시에는 실시간 값이 우선) */
function syncCryptoSnapshot(){
  if(!S.data) return;
  var cr=(S.data.indicators||[]).filter(function(x){return x.id==='crypto';})[0];
  if(!cr||!cr.rows) return;
  var n=0;
  (S.data.assets||[]).forEach(function(a){
    if(String(a.market||'').toUpperCase()!=='CRYPTO'||a.quoteAt) return;
    var row=cr.rows.filter(function(r){ return r.label===a.code||r.label===a.name; })[0];
    if(!row||typeof row.value!=='number') return;
    var s=a.series||[], last=s[s.length-1], rs=(row.series||[])[(row.series||[]).length-1];
    if(!last||!rs||last.d!==rs.d) return;
    if(a.price===row.value&&a.display===row.display) return;
    a.price=row.value;
    if(row.display) a.display=row.display;
    if(row.delta) a.delta=row.delta;
    last.v=row.value;
    n++;
  });
  S.syncN=n;
}

/* ---------- v6: 도감 상태 필터 · 퀵 테스트 ---------- */
function studyFiltered(){
  var all=(S.data&&S.data.study)||[];
  var cur=S.stag||'전체';
  return all.filter(function(s){
    if(cur!=='전체'&&s.tag!==cur) return false;
    if(S.sstate!=='all'&&studyState(s)!==S.sstate) return false;
    return true;
  });
}
function qtFind(key){
  var all=(S.data&&S.data.study)||[];
  for(var i=0;i<all.length;i++) if(studyKey(all[i])===key) return all[i];
  return null;
}
var QT_LABEL={0:'몰랐어',1:'애매해',2:'알았어'};
var QT_GAP=3; /* 몰랐어·애매해 카드는 3장 뒤에 한 번 더 물어 회수한다 */
var QT_SESSION=10; /* 사용자 규칙: 학습 세트는 10장 단위(전체는 따로 고른다) */
/* v9: 복습 우선순위 — 미학습(0) → 애매(1) → 오래된 완료(복습 필요, 2) → 최근 완료(3) */
var STUDY_REVIEW_DAYS=7;
function studyPrio(s){
  var st=studyState(s);
  if(st===0) return 0;
  if(st===1) return 1;
  var d=daysSince(S.smeta[studyKey(s)]);
  if(d==null||d>=STUDY_REVIEW_DAYS) return 2;
  return 3;
}
function studyReviewList(list){
  return (list||[]).filter(function(s){ return studyState(s)===2&&studyPrio(s)===2; });
}
function qtPool(){
  var pool=studyFiltered();
  if(!pool.length) pool=((S.data&&S.data.study)||[]).slice();
  return pool;
}
function qtStart(limit){
  var pool=qtPool();
  if(!pool.length){ toast('도감 데이터가 없습니다.'); return; }
  /* 상태·복습 필요도로 줄을 세우고, 같은 줄에서는 이번에 본 카드를 뒤로 민다 */
  var arr=pool.map(function(s){
    var k=studyKey(s);
    return {k:k, p:studyPrio(s), seen:S.qtSeen[k]?1:0};
  });
  arr.sort(function(a,b){
    if(a.p!==b.p) return a.p-b.p;
    if(a.seen!==b.seen) return a.seen-b.seen;
    return Math.random()-0.5;
  });
  var n=(typeof limit==='number'&&limit>0)?Math.min(limit,arr.length):arr.length;
  var picks=arr.slice(0,n), mix={0:0,1:0,2:0};
  picks.forEach(function(x){ mix[x.p===3?2:x.p]++; S.qtSeen[x.k]=Date.now(); });
  qtStartQueue(picks.map(function(x){return x.k;}),{limit:n,total:arr.length,mix:mix});
}
function qtStartQueue(keys,opt){
  keys=(keys||[]).filter(function(k){ return !!qtFind(k); });
  if(!keys.length){ toast('도감 데이터가 없습니다.'); return; }
  S.qt={queue:keys.map(function(k){return {k:k,r:0};}), i:0, phase:'ask',
        log:{0:0,1:0,2:0}, last:null, re:0, got:0, open:[],
        limit:(opt&&opt.limit)||0, pool:(opt&&opt.total)||keys.length, mix:(opt&&opt.mix)||null};
  openSheet(qtHTML());
}

function qtStep(dir){
  var q=S.qt; if(!q) return;
  q.i+=dir; q.phase='ask'; q.last=null;
  rerenderSheet();
}
function qtGrade(v){
  var q=S.qt; if(!q) return;
  var it=q.queue[q.i]; if(!it) return;
  var s=qtFind(it.k); if(!s) return;
  if(v) S.study[it.k]=v; else delete S.study[it.k];
  saveStudy();
  S.smeta[it.k]=todayISO(); saveSMeta();
  if(it.r===0){
    q.log[v]=(q.log[v]||0)+1;
    /* 몰랐어·애매해는 3장 뒤에 한 번 더(세션이 짧으면 끝에 붙는다) */
    if(v<=1){
      var at=Math.min(q.i+1+QT_GAP,q.queue.length);
      q.queue.splice(at,0,{k:it.k,r:1,was:v});
    }
  }else{
    q.re++;
    if(v===2) q.got++;
    else if(q.open.indexOf(it.k)<0) q.open.push(it.k);
  }
  q.last=v; q.phase='done';
  rerenderSheet();
}

/* 국내 마감은 평일 16:00, 미국 마감은 화~토 07:00(KST)에 자동 반영된다. */
function nextBriefAt(kind, now){
  now=now||new Date();
  var i, d, w;
  if(kind==='kr'){
    for(i=0;i<8;i++){
      d=new Date(now.getTime()); d.setDate(d.getDate()+i); d.setHours(16,0,0,0);
      w=d.getDay();
      if(w>=1&&w<=5&&d.getTime()>now.getTime()) return d;
    }
  }else{
    for(i=0;i<8;i++){
      d=new Date(now.getTime()); d.setDate(d.getDate()+i); d.setHours(7,0,0,0);
      w=d.getDay();
      if(w>=2&&w<=6&&d.getTime()>now.getTime()) return d;
    }
  }
  return null;
}
var WD_KO=['일','월','화','수','목','금','토'];
function briefWhen(dt){
  if(!dt) return '';
  return ('0'+(dt.getMonth()+1)).slice(-2)+'/'+('0'+dt.getDate()).slice(-2)+'('+WD_KO[dt.getDay()]+') '+
    ('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
}
function briefIn(dt){
  if(!dt) return '';
  var ms=dt.getTime()-Date.now();
  if(ms<=0) return '지금';
  var m=Math.round(ms/60000);
  if(m<60) return m+'분 후';
  var hh=Math.floor(m/60), mm=m%60;
  if(hh<24) return hh+'시간'+(mm?' '+mm+'분':'')+' 후';
  return Math.floor(hh/24)+'일 '+(hh%24)+'시간 후';
}
function briefNextHTML(){
  var now=new Date(), nk=nextBriefAt('kr',now), nu=nextBriefAt('us',now);

    '<div class="bnt">다음 정기 브리핑</div>'+
    '<div class="bnl" data-bnext="kr"><b>국내</b><span class="bt">'+esc(briefWhen(nk))+'</span>'+
      '<span class="bd">'+esc(briefIn(nk))+'</span></div>'+
    '<div class="bnl" data-bnext="us"><b>미국</b><span class="bt">'+esc(briefWhen(nu))+'</span>'+
      '<span class="bd">'+esc(briefIn(nu))+'</span></div>'+

}

/* 카드 내 미니 PER·PBR 밴드 */
function miniBand(kind,cur,band){
  if(!band||typeof cur!=='number') return '';
  var lo=band.low, hi=band.high;
  var mn=Math.min(lo,cur), mx=Math.max(hi,cur);
  var span=(mx-mn)||1, off=span*0.08; mn-=off; mx+=off;
  var pos=function(v){ return clamp((v-mn)/((mx-mn)||1)*100); };
  var gap=(cur/lo-1)*100;
  var tone=(cur<=band.mid)?'':' warn';
  return '<div class="mbm"><div class="t"><span>'+esc(kind)+'</span><b>'+nf(cur,2)+'</b></div>'+
    '<div class="tr"><i style="left:'+pos(cur).toFixed(1)+'%"></i></div>'+
    '<div class="f"><span>하단 '+nf(lo,2)+'</span><em class="'+tone.trim()+'">'+(cur<lo?'하단↓ ':'')+sgn(gap,1)+'</em></div></div>';
}

/* 카드 내 미니 실적 막대(매출·영업이익) */
function miniFin(a){
  var fin=a.fin; if(!fin) return '';
  var ps=(fin.quarterly&&fin.quarterly.length?fin.quarterly:fin.annual)||[];
  ps=ps.filter(function(p){ return typeof p.revenue==='number'; });
  if(ps.length<2) return '';
  ps=ps.slice(-6);
  var W=300,H=56,pl=2,pr=2,pt=5,pb=12, pw=W-pl-pr, ph=H-pt-pb;
  var maxRev=Math.max.apply(null,ps.map(function(p){ return p.revenue||0; }))||1;
  var band=pw/ps.length, bw=Math.max(5,Math.min(band*0.56,22));
  var bars='', labs='';
  ps.forEach(function(p,i){
    var cx=pl+band*(i+0.5);
    var rh=Math.max(1,(p.revenue||0)/maxRev*ph);
    bars+='<rect class="b1" x="'+(cx-bw/2).toFixed(1)+'" y="'+(pt+ph-rh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+rh.toFixed(1)+'" rx="1.5"/>';
    if(typeof p.op==='number'){
      var oh=Math.max(1,Math.abs(p.op)/maxRev*ph);
      if(p.op>=0) bars+='<rect class="b2" x="'+(cx-bw/2).toFixed(1)+'" y="'+(pt+ph-oh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+oh.toFixed(1)+'" rx="1.5"'+(p.consensus?' opacity=".5"':'')+'/>';
      else bars+='<rect class="bn" x="'+(cx-bw/2).toFixed(1)+'" y="'+(pt+ph).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+oh.toFixed(1)+'" rx="1.5"/>';
    }
    labs+='<text class="bl" x="'+cx.toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle">'+esc(String(p.label).replace(/^20/,''))+'</text>';
  });
  var last=ps[ps.length-1];
  return '<div class="mfin"><div class="t"><span>실적 '+(fin.quarterly&&fin.quarterly.length?'분기':'연간')+'</span>'+
    '<span><b>'+esc(last.label)+'</b> 매출 '+fmtMoney(last.revenue,fin.unit||'억 원')+
    (typeof last.margin==='number'?' · 영업이익률 '+nf(last.margin,1)+'%':'')+'</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(a.name||'')+' 실적 미니 막대">'+bars+labs+'</svg></div>';
}

/* ---------- v8: 카드에서 바로 보는 신호(손절·목표까지 거리) ---------- */
/* 표시 기준은 카드 밴드·가격 지도와 같은 barValue(ETH는 원화) */
function sigBase(a){
  if(!a) return null;
  if(typeof a.barValue==='number'&&isFinite(a.barValue)&&a.barValue>0) return a.barValue;
  return (typeof a.price==='number'&&isFinite(a.price))?a.price:null;
}
function assetSignals(a){
  var r={alerts:[],dists:[]};
  var base=sigBase(a);
  if(base==null||!(base>0)) return r;
  if(typeof a.stop==='number'&&a.stop>0){
    var g=(base/a.stop-1)*100;
    if(g<0) r.alerts.push({c:'bad',k:'stop',t:'손절선 하회 '+nf(Math.abs(g),1)+'%'});
    else if(g<=2) r.alerts.push({c:'warn',k:'stopnear',t:'손절선 '+nf(g,1)+'% 앞'});
    else r.dists.push({c:'',t:'손절 -'+nf(g,1)+'%'});
  }
  var tgs=(a.targets||[]).filter(function(t){ return t&&typeof t.from==='number'&&t.from>0; });
  tgs.forEach(function(t,j){
    var to=(typeof t.to==='number'&&t.to>t.from)?t.to:t.from;
    var lab=String(t.label||((j+1)+'차'));
    var buy=/매수/.test(lab);
    if(buy){
      if(base>=to) r.alerts.push({c:'ok',k:'t'+j+'r',t:lab+' 위 '+nf((base/to-1)*100,0)+'%'});
      else if(base>=t.from) r.alerts.push({c:'ok',k:'t'+j+'r',t:lab+' 진입'});
      else if((t.from/base-1)*100<=3) r.alerts.push({c:'warn',k:'t'+j+'n',t:lab+' '+nf((t.from/base-1)*100,1)+'% 앞'});
      else r.dists.push({c:'',t:lab+' +'+nf((t.from/base-1)*100,1)+'%'});
    }else{
      if(base>=to) r.alerts.push({c:'ok',k:'t'+j+'r',t:lab+' 목표 도달'});
      else if(base>=t.from) r.alerts.push({c:'ok',k:'t'+j+'r',t:lab+' 목표권'});
      else if((t.from/base-1)*100<=5) r.alerts.push({c:'warn',k:'t'+j+'n',t:lab+' 목표 '+nf((t.from/base-1)*100,1)+'% 앞'});
      else r.dists.push({c:'',t:lab+' +'+nf((t.from/base-1)*100,1)+'%'});
    }
  });
  /* v9: 분할 매수 계획 — 계획 단가에 닿았거나(도달) 2% 이내로 가까우면(근접) 카드에 올린다 */
  plansOf(a).forEach(function(p,j){
    if(!p||!(p.px>0)) return;
    var lab='매수 계획 '+(j+1)+'단';
    var gp=(base/p.px-1)*100;   /* +면 현재가가 계획가 위(아직 안 옴), 0 이하면 계획가 이하(도달) */
    if(gp<=0) r.alerts.push({c:'plan',k:'p'+j+'r',t:lab+' 도달'});
    else if(gp<=2) r.alerts.push({c:'plan',k:'p'+j+'n',t:lab+' '+nf(gp,1)+'% 앞'});
    else r.dists.push({c:'',t:'계획 '+(j+1)+'단 '+nf(gp,1)+'% 위'});
  });
  return r;
}
/* 임박·도달 신호가 있으면 그것만, 없으면 남은 거리를 회색 칩으로 */
/* v9: 손절 → 매수 계획 → 목표 순으로 보여 주고, 오늘 처음 걸린 신호에 '오늘' 표시를 붙인다 */
var SIG_ORDER={bad:0,plan:1,warn:2,ok:3};
var SIG_GONE_DAYS=3;  /* 이 기간 넘게 안 보인 신호의 기록만 지운다 */
function sigLogRec(a,it){
  if(!a||!it||!it.k) return null;
  return sigRec(S.siglog[(a.id||'')+'|'+it.k]);
}
function sigToday(a,it){
  var r=sigLogRec(a,it);
  return !!r&&r.d===todayISO();
}
function sigRow(a,max){
  var s=assetSignals(a), lim=max||2;
  var items;
  if(s.alerts.length){
    items=s.alerts.slice().sort(function(x,y){
      return (SIG_ORDER[x.c]==null?9:SIG_ORDER[x.c])-(SIG_ORDER[y.c]==null?9:SIG_ORDER[y.c]);
    });
    /* 임박·도달이 1개뿐이면 남는 자리를 거리 칩으로 채운다 — 신호 하나 뜨면 손절 거리가 사라지지 않게 */
    for(var i=0;i<s.dists.length&&items.length<lim;i++) items.push(s.dists[i]);
  } else items=s.dists;
  if(!items.length) return '';
  return '<div class="sigrow">'+items.slice(0,max||2).map(function(it){
    return '<span class="sig'+(it.c?' '+it.c:'')+'"'+(it.k?' data-sk="'+esc((a.id||'')+'|'+it.k)+'"':'')+'><i></i>'+esc(it.t)+
      (sigToday(a,it)?'<em class="snew">오늘</em>':'')+'</span>';
  }).join('')+'</div>';
}

    if(typeof x.stop==='number') marks='<span class="mk2 stp" style="left:'+Math.max(0.6,pos(x.stop)).toFixed(2)+'%"></span>'+marks;
    h+='<div class="abar"><span class="at2"></span>'+seg+marks+
      '<span class="lbl" style="left:'+Math.max(12,Math.min(88,pos(val))).toFixed(2)+'%">현재</span></div>';

    var lg=[];

    lg.push('<div><i style="background:var(--tx)"></i>현재<b>'+esc(x.display)+'</b></div>');
    if(typeof x.avg==='number') lg.push('<div><i style="background:var(--warn)"></i>평단<b>'+bu+bigNum(x.avg)+'</b><span class="pct">'+sgn((val/x.avg-1)*100,1)+'</span></div>');
    if(typeof x.stop==='number') lg.push('<div><i style="background:var(--bad)"></i>손절<b>'+bu+bigNum(x.stop)+'</b><span class="pct">'+sgn((x.stop/val-1)*100,1)+'</span></div>');
    (x.targets||[]).forEach(function(t){
      lg.push('<div><i style="background:var(--good)"></i>'+esc(t.label)+'<b>'+bu+bigNum(t.from)+(t.to!==t.from?'~'+bigNum(t.to):'')+'</b>'+

}

function insiderAvg(a){
  var q=0, amt=0;
  (a.insiders||[]).forEach(function(r){
    if(typeof r.px==='number'&&typeof r.qty==='number'&&r.qty>0&&r.kind.indexOf('매수')>=0){ q+=r.qty; amt+=r.px*r.qty; }
  });
  if(!q) return null;
  return Math.round(amt/q);
}

/* ---------- v9: 분할 매수 계획(최대 3단) — 상세 시트에서 저장 ---------- */
function planDraft(a){
  if(!S.planDraft||S.planDraft.id!==a.id){
    var cur=plansOf(a), rows=[];
    for(var i=0;i<3;i++){
      var p=cur[i];
      rows.push({px:(p&&p.px)?String(Math.round(p.px*100)/100):'',
                 qty:(p&&typeof p.qty==='number')?String(p.qty):''});
    }
    S.planDraft={id:a.id, rows:rows};
  }
  return S.planDraft;
}
function planUnit(a){ return simCur(a)==='USD'?'$':'원'; }
function planHTML(a){
  var d=planDraft(a), saved=plansOf(a), unit=planUnit(a), unitQ=simQtyUnit(a);
  var h='<div class="msec plan"><h4>분할 매수 계획 · 최대 3단</h4>'+
    '<div class="pnote">단가를 저장해 두면 현재가가 그 단가의 <b>2% 이내</b>로 오면 <b>근접</b>, 닿으면 <b>도달</b> 신호가 카드·신호 필터에 붙습니다. 수량은 비워도 됩니다.</div>';
  h+='<div class="prows">';
  for(var i=0;i<3;i++){

      '<input data-pf="px" data-pi="'+i+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(r.px)+'" placeholder="단가('+unit+')" aria-label="'+(i+1)+'단 단가">'+
      '<input data-pf="qty" data-pi="'+i+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(r.qty)+'" placeholder="수량('+unitQ+') 선택" aria-label="'+(i+1)+'단 수량">'+
      '</div>';
  }
  h+='</div>';
  if(saved.length){
    h+='<div class="plansum"><span class="t">저장된 계획</span>'+saved.map(function(p,j){
      var gp=planGap(a,p);
      var st=(gp==null)?'':(gp<=0?'<em class="on">도달</em>':(gp<=2?'<em class="near">'+nf(gp,1)+'% 앞</em>':'<em>'+nf(gp,1)+'% 위</em>'));
      return '<span class="pi2">'+(j+1)+'단 <b>'+simMoney(a,p.px)+'</b>'+planQtyText(a,p)+st+'</span>';
    }).join('')+'</div>';
  }
  h+='<div class="pmsg" id="planmsg" hidden></div>';
  h+='<div class="simcta"><button class="btn" type="button" data-pclear="1"'+(saved.length?'':' disabled')+'>계획 지우기</button>'+
     '<button class="btn pri" type="button" data-psave="1">계획 저장</button></div>';
  h+='</div>';
  return h;
}
function planSave(a){
  var d=planDraft(a), rows=[], err='';
  d.rows.forEach(function(r,i){
    var has=(String(r.px||'').trim()||String(r.qty||'').trim());
    if(!has) return;
    var px=simNum(r.px), q=simNum(r.qty);
    if(!(px>0)){ if(!err) err=(i+1)+'단 단가를 확인하세요.'; return; }
    if(String(r.qty||'').trim()&&!(q>0)){ if(!err) err=(i+1)+'단 수량을 확인하세요.'; return; }
    rows.push({px:px, qty:(q>0?q:null)});
  });
  var msg=$id('planmsg');
  if(err){
    if(msg){ msg.textContent=err; msg.className='pmsg bad'; msg.hidden=false; }
    toast(err); return;
  }
  if(!rows.length){
    if(msg){ msg.textContent='단가를 하나 이상 입력하세요.'; msg.className='pmsg bad'; msg.hidden=false; }
    toast('단가를 하나 이상 입력하세요.'); return;
  }
  S.plans[a.id]=rows; savePlans();
  S.dirty=true;  /* 뒤쪽 카드·신호 필터도 다시 그리게 */
  toast('계획을 저장했습니다 · '+rows.map(function(p,j){ return (j+1)+'단 '+simMoney(a,p.px); }).join(' · '));
  var sheet=$id('msheet'), top=sheet?sheet.scrollTop:0;
  openAsset(a.id);
  if(sheet) sheet.scrollTop=top;
}
function planClear(a){
  if(!S.plans[a.id]) return;
  if(!window.confirm('"'+a.name+'"의 분할 매수 계획을 지울까요?')) return;
  delete S.plans[a.id]; savePlans();
  S.planDraft=null; S.dirty=true;
  toast('매수 계획을 지웠습니다.');
  var sheet=$id('msheet'), top=sheet?sheet.scrollTop:0;
  openAsset(a.id);
  if(sheet) sheet.scrollTop=top;
}

function saveAssetFromForm(id){
  var g=function(k){ var el=document.querySelector('[data-f="'+k+'"]'); return el?el.value.trim():''; };
  var name=g('name'); if(!name){ var e=$id('formErr'); e.textContent='종목명을 입력해 주세요.'; e.hidden=false; return; }
  var numOr=function(v){ if(!v) return null; var n=parseNum(v); return (isNaN(n)?null:n); };
  function parseNum(v){ return parseFloat(String(v).replace(/[,\s원$%]/g,'')); }
  var price=numOr(g('price'));
  var avg=numOr(g('avg'));
  var stop=numOr(g('stop'));
  var qtyNum=numOr(g('qtyNum')), invested=numOr(g('invested'));
  var tf=numOr(g('targetFrom')), tt=numOr(g('targetTo'));
  var market=g('market')||'KOSPI';
  var targets=[];
  if(tf!=null) targets.push({label:'1차',from:tf,to:(tt!=null?tt:tf)});
  var base=id?assetById(id):null;
  var prev=base||{};
  /* 수정 시 2차 등 나머지 목표가 구간은 보존 */
  if(base&&prev.targets&&prev.targets.length>1){
    targets=targets.concat(prev.targets.slice(1));
  }
  var obj={
    id:id||('c'+Date.now()),
    name:name,
    code:g('code'),
    market:market,
    price:(price!=null?price:(prev.price!=null?prev.price:null)),
    avg:avg, qty:g('qty'), qtyNum:qtyNum, invested:invested, stop:stop,
    targets:targets,
    kill:g('kill'), note:g('note'),
    series:prev.series||null, seriesSource:prev.seriesSource||'',
    fin:prev.fin||null, per:prev.per||null, pbr:prev.pbr||null,
    insiders:prev.insiders||[], leading:prev.leading||[], returns:prev.returns||[],
    barMax:prev.barMax||null,
    custom: prev.custom||!base
  };
  if(obj.qtyNum==null) delete obj.qtyNum;
  if(obj.invested==null) delete obj.invested;
  if(obj.price!=null) obj.display=priceText(obj);
  else obj.display='가격 미입력';
  if(obj.targets.length===0) delete obj.targets;
  upsertAsset(obj);
  if(!id) setOrder(orderedIds());
  toast(id?'수정했습니다.':'종목을 추가했습니다.');
  render();
  if(id) openAsset(id); else closeModal();
}

function viewStudy(){
  var all=(S.data&&S.data.study)||[];
  var tags=['전체'];
  all.forEach(function(s){ if(tags.indexOf(s.tag)<0) tags.push(s.tag); });
  var cur=S.stag||'전체';
  if(tags.indexOf(cur)<0) cur='전체';
  var items=all.filter(function(s){
    if(cur!=='전체'&&s.tag!==cur) return false;
    if(S.sstate!=='all'&&studyState(s)!==S.sstate) return false;
    return true;
  });
  var idx={}; all.forEach(function(s,i){ idx[studyKey(s)]=i; });
  /* 미학습 → 애매함(?) → 완료(✓) 순으로 자동 정렬 */
  items=items.slice().sort(function(a,b){
    var ra=studyState(a), rb=studyState(b);
    if(ra!==rb) return ra-rb;
    return (idx[studyKey(a)]||0)-(idx[studyKey(b)]||0);
  });
  var c=studyCounts(all), tot=all.length||1, pct=Math.round(c[2]/tot*100);
  var tagItems=all.filter(function(s){ return cur==='전체'||s.tag===cur; });
  var ct=studyCounts(tagItems);
  var rv=studyReviewList(all).length;
  var hint=all.length+'개 · '+(cur==='전체'?'전체':cur);
  if(S.sstate!=='all') hint+=' · '+(S.sstate===1?'애매':(S.sstate===2?'완료':'미학습'))+' '+items.length+'개';
  if(rv) hint+=' · 복습 필요 '+rv;
  var h='<div class="sec"><h2>공부 도감</h2><span class="hint">'+hint+'</span></div>';
  h+='<div class="sprog"><div class="nums">'+
      '<span>미학습<b>'+c[0]+'</b></span>'+
      '<span class="c1">애매<b>'+c[1]+'</b></span>'+
      '<span class="c2">완료<b>'+c[2]+'</b></span></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<span class="pct">'+pct+'%</span></div>';
  /* 상태 필터 — 미학습만 / 애매한 것만 / 완료한 것만 */
  h+='<div class="sstatus" role="group" aria-label="학습 상태 필터">'+
      [['all','전체',tagItems.length],['0','미학습',ct[0]],['1','애매',ct[1]],['2','완료',ct[2]]].map(function(x){
        return '<button data-sstate="'+x[0]+'" class="'+(String(S.sstate)===x[0]?'on':'')+'" aria-pressed="'+(String(S.sstate)===x[0]?'true':'false')+'"'+
          (x[0]==='1'?' style="color:var(--warn-tx)"':(x[0]==='2'?' style="color:var(--good-tx)"':''))+
          '>'+x[1]+'<b>'+x[2]+'</b></button>';
      }).join('')+'</div>';
  var qtN=Math.min(QT_SESSION,items.length);
  h+='<div class="qtestbar"><button class="btn pri" id="btnQuizTest" data-qtlimit="'+QT_SESSION+'"'+(items.length?'':' disabled')+'>⚡ 퀵 테스트 '+qtN+'장</button>'+
     '<button class="btn" data-qtlimit="0"'+(items.length?'':' disabled')+'>전체 '+items.length+'장</button></div>';
  h+='<div class="sfilter">'+tags.map(function(t){
      return '<button data-stag="'+esc(t)+'" class="'+(t===cur?'on':'')+'" aria-pressed="'+(t===cur?'true':'false')+'">'+esc(t)+'</button>';
    }).join('')+'</div>';
  if(!items.length){
    h+='<article class="card"><p class="empty">이 필터에 해당하는 카드가 없습니다. 상태 필터를 「전체」로 바꿔보세요.</p></article>';
  }
  h+=items.map(function(s){
    var tbl='';
    if(s.table){
      tbl='<div class="stbl"><div class="sr">'+s.table.head.map(function(c2){return '<span>'+esc(c2)+'</span>';}).join('')+'</div>'+
        s.table.rows.map(function(r){return '<div class="sr">'+r.map(function(c2){return '<span>'+esc(c2)+'</span>';}).join('')+'</div>';}).join('')+'</div>';
    }
    var st=studyState(s), key=studyKey(s);
    var stt='<div class="stt" data-stt="'+esc(key)+'" role="group" aria-label="학습 상태">'+
      [[0,'미학습'],[1,'? 애매'],[2,'✓ 완료']].map(function(p){
        return '<button type="button" data-sv="'+p[0]+'" class="'+(st===p[0]?'on':'')+'" '+
          'aria-pressed="'+(st===p[0]?'true':'false')+'">'+p[1]+'</button>';}).join('')+'</div>';
    return '<details class="study s'+st+'"'+(S.openStudy[key]?' open':'')+'><summary><div class="srow"><span class="tg2">'+esc(s.tag)+'</span>'+
      '<span class="sn">'+esc(s.title)+'</span><span class="chv">›</span></div>'+stt+'</summary>'+
      '<div class="study-body"><p class="ss">'+esc(s.summary)+'</p>'+tbl+
      (s.body||[]).map(function(b){return '<p class="bp">'+rich(b)+'</p>';}).join('')+
      (s.check&&s.check.length?'<div class="study-ck"><div class="ckt">✔ 실전 체크포인트</div><ul>'+
        s.check.map(function(c2){return '<li>'+rich(c2)+'</li>';}).join('')+'</ul></div>':'')+
      '</div></details>';
  }).join('');
  h+='<div class="foot">숫자는 '+esc(S.data.meta.asOfLabel)+' 브리핑·3분기 DART 원문과 2026년 시행 기준입니다. '+
    '상태는 이 기기에 저장되며, 미학습 → 애매함 → 완료 순으로 자동 정렬됩니다. 판단의 근거 자료이며 매매 권유가 아닙니다.</div>';
  return h;
}

/* v9: 신호가 처음 걸린 날을 가볍게 기록해 '오늘 새로'를 구분한다.
   지금 걸리지 않는 신호의 기록은 지우므로, 다시 걸리면 그날이 새 날짜가 된다. */
function sigLogSync(){
  if(!S.data) return;
  var today=todayISO(), log=S.siglog||{}, changed=false, live={};
  assets().forEach(function(a){
    assetSignals(a).alerts.forEach(function(al){
      if(!al.k) return;
      var k=(a.id||'')+'|'+al.k;
      live[k]=1;
      var r=sigRec(log[k]);
      if(!r){ log[k]={d:today,u:today}; changed=true; }
      else if(r.u!==today){ r.u=today; log[k]=r; changed=true; }
    });
  });
  Object.keys(log).forEach(function(k){
    if(live[k]) return;
    var r=sigRec(log[k]);
    if(!r){ delete log[k]; changed=true; return; }
    var gap=daysSince(r.u);
    if(gap==null||gap>=SIG_GONE_DAYS){ delete log[k]; changed=true; }
  });
  if(changed){ S.siglog=log; saveSigLog(); }
}
function render(){
  var main=$id('main');
  if(S.err){
    main.innerHTML='<div class="err"><b>데이터를 불러오지 못했습니다.</b><br>'+esc(S.err)+
      '<div class="toolrow"><button class="btn pri" id="btnRetry">다시 시도</button></div></div>';
    var rb=$id('btnRetry'); if(rb) rb.addEventListener('click',boot);
    return;
  }
  if(!S.data) return;
  sigLogSync();
  S.charts={};
  var html='';
  if(S.tab==='overview') html=viewOverview();
  else if(S.tab==='briefing') html=viewBriefing();
  else if(S.tab==='scenario') html=viewScenario();
  else if(S.tab==='companies') html=viewCompanies();
  else html=viewStudy();
  main.innerHTML=html;
  bindView();
  bindCharts();
}

function importJSON(ev){
  var f=ev.target.files&&ev.target.files[0];
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(String(fr.result));
      var m=o&&o.memos?o.memos:o;
      var cnt=0;
      if(m&&typeof m==='object'){
        var q=m.quiz||{}, b=m.brief||{}, n=Array.isArray(m.notes)?m.notes:[];
        Object.keys(q).forEach(function(k){ S.memos.quiz[k]=q[k]; cnt++; });
        Object.keys(b).forEach(function(k){ S.memos.brief[k]=b[k]; cnt++; });
        n.forEach(function(x){ if(x&&x.text){ S.memos.notes.unshift(x); cnt++; } });
        saveMemos();
      }
      if(o&&o.assets&&typeof o.assets==='object'){
        var A=o.assets;
        S.ast={deleted:Array.isArray(A.deleted)?A.deleted:[],
               overrides:(A.overrides&&typeof A.overrides==='object')?A.overrides:{},
               custom:Array.isArray(A.custom)?A.custom:[],
               order:Array.isArray(A.order)?A.order:[]};
        saveAssets(); cnt+=S.ast.custom.length;
      }
      /* v9: 계획·실현손익·신호일·판정일 (없는 예전 백업도 그대로 불러온다) */
      if(o&&o.plans&&typeof o.plans==='object'){
        Object.keys(o.plans).forEach(function(id){
          var clean=normPlanList(o.plans[id]);
          if(clean.length){ S.plans[id]=clean; cnt+=clean.length; } else delete S.plans[id];
        });
        savePlans();
      }
      if(o&&o.realized&&Array.isArray(o.realized.items)){
        var add=normRealItems(o.realized.items);
        S.real.items=S.real.items.concat(add).slice(0,200);
        saveReal(); cnt+=add.length;
      }
      if(o&&o.siglog&&typeof o.siglog==='object'){
        Object.keys(o.siglog).forEach(function(k){ var r=sigRec(o.siglog[k]); if(r) S.siglog[k]=r; });
        saveSigLog();
      }
      if(o&&o.smeta&&typeof o.smeta==='object'){
        Object.keys(o.smeta).forEach(function(k){ if(isISO(o.smeta[k])) S.smeta[k]=o.smeta[k]; });
        saveSMeta();
      }
      render();
      toast('불러왔습니다 · '+cnt+'개 항목');
    }catch(e){ toast('불러오지 못했습니다. 내보낸 JSON 파일인지 확인해 주세요.'); }
  };
  fr.readAsText(f);
  ev.target.value='';
}

function fetchJSON(url,ms){

}
function applyLive(o){
  S.live={src:o.src,at:nowMD(),btc:o.btc,eth:o.eth,fng:o.fng||null};
  var cr=S.data.indicators.filter(function(x){return x.id==='crypto';})[0];
  if(cr){
    cr.rows.forEach(function(r){
      var live=null, chg=null;
      if(r.label==='BTC'&&typeof o.btc==='number'){ live=o.btc; chg=o.btcChg; }
      if(r.label==='ETH'&&typeof o.eth==='number'){ live=o.eth; chg=o.ethChg; }
      if(live==null) return;
      r.value=live; r.display='$'+nf(Math.round(live),0);
      if(typeof chg==='number') r.delta={text:sgn(chg,2),dir:chg>=0?'up':'down'};
      /* 차트의 '현재' 값도 실시간과 맞춘다 */
      if(r.series&&r.series.length){
        var td=todayISO(), lst=r.series[r.series.length-1];
        if(lst.d===td) lst.v=Math.round(live); else r.series.push({d:td,v:Math.round(live)});
      }
    });
    if(o.fng){
      cr.chips=(cr.chips||[]).filter(function(c){return c.text.indexOf('공포탐욕')<0;});
      cr.chips.push({text:'공포탐욕 '+o.fng.value+' · '+fngKo(o.fng.cls),level:o.fng.value<25?'bad':(o.fng.value>75?'warn':'')});
    }
  }
  /* '종목' 탭의 크립토 자산도 같은 실시간 값으로 맞춘다(지표·종목 숫자 불일치 방지).
     BTC만 고치면 ETH 카드가 이전 종가에 남아 두 탭이 어긋나므로 모든 크립토 자산을 돌린다. */
  (S.data.assets||[]).forEach(function(a){
    if(String(a.market||'').toUpperCase()!=='CRYPTO') return;
    var px=null, chg=null, code=String(a.code||'').toUpperCase(), nm=String(a.name||'');
    if(code==='BTC'||nm==='비트코인'){ px=o.btc; chg=o.btcChg; }
    else if(code==='ETH'||nm==='이더리움'){ px=o.eth; chg=o.ethChg; }
    if(typeof px!=='number') return;
    a.price=px; a.display=priceFmt(a,px);
    if(typeof chg==='number') a.delta={text:sgn(chg,2),dir:chg>=0?'up':'down'};
    if(a.series&&a.series.length){
      var td=todayISO(), lst=a.series[a.series.length-1];
      if(lst.d===td) lst.v=Math.round(px); else a.series.push({d:td,v:Math.round(px)});
    }
  });
  if(S.tab==='overview'||S.tab==='companies') render();
}
function todayISO(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function isoFromDate(dt){
  if(!dt) return todayISO();
  return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2);
}
/* 공개 시세 보조 갱신(Yahoo 차트 API) — 실패해도 매일 07:00/16:00 종가 반영은 그대로.
   기본 종목의 가격·등락률·마지막 차트점만 갱신하고, 사용자 입력(평단·수량·목표가·손절)은 건드리지 않는다. */
function applyQuote(a, px, prev, dt){
  if(typeof px!=='number'||!isFinite(px)) return false;
  var mk=String(a.market||'').toUpperCase();
  a.price=px;
  a.display=(mk==='CRYPTO')?('$'+nf(px,px<100?2:0)):
            ((mk==='NASDAQ'||mk==='NYSE'||mk==='US')?('$'+nf(px,2)):(nf(px,0)+'원'));
  if(typeof prev==='number'&&prev>0){
    var pc=(px/prev-1)*100;
    a.delta={text:sgn(pc,2),dir:pc>0?'up':(pc<0?'down':'flat')};
  }
  if(a.series&&a.series.length){
    var d=isoFromDate(dt), lst=a.series[a.series.length-1];
    if(lst.d===d) lst.v=px; else if(lst.d<d) a.series.push({d:d,v:px});
  }
  a.quoteAt=nowMD();
  return true;
}
function refreshQuotes(){
  if(S.quotePromise) return S.quotePromise;
  /* 병합 사본이 아니라 시드 원본을 갱신해야 카드 숫자와 차트 마지막 점이 함께 바뀐다 */
  var list=((S.data&&S.data.assets)||[]).filter(function(a){ return a.quoteSymbol && String(a.market).toUpperCase()!=='CRYPTO'; });
  if(!list.length||typeof fetch!=='function') return Promise.resolve(0);
  var n=0;
  S.quotePromise=Promise.all(list.map(function(a){
    var url='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(a.quoteSymbol)+
      '?range=5d&interval=1d';
    return fetchJSON(url,6000).then(function(j){
      var res=j&&j.chart&&j.chart.result&&j.chart.result[0];
      if(!res||!res.meta) return;
      var m=res.meta;
      var px=(typeof m.regularMarketPrice==='number')?m.regularMarketPrice:null;
      var prev=(typeof m.chartPreviousClose==='number')?m.chartPreviousClose:
               (typeof m.previousClose==='number'?m.previousClose:null);
      var dt=m.regularMarketTime?new Date(m.regularMarketTime*1000):null;
      if(applyQuote(a,px,prev,dt)) n++;
    }).catch(function(){});
  })).then(function(){ S.quotePromise=null; if(n) render(); return n; },
          function(){ S.quotePromise=null; return 0; });
  return S.quotePromise;
}
function fngKo(cls){
  var m={'Extreme Fear':'극단적 공포','Fear':'공포','Neutral':'중립','Greed':'탐욕','Extreme Greed':'극단적 탐욕'};
  return m[cls]||cls||'';
}
function refreshLive(){
  var b=$id('btnLive');
  b.classList.add('busy');
  var done=false;
  function finish(msg){ if(done) return; done=true; b.classList.remove('busy'); if(msg) toast(msg); }
  var fngP=fetchJSON('https://api.alternative.me/fng/?limit=1',5000).then(function(d){
    var v=d&&d.data&&d.data[0]; if(!v) return null;
    return {value:parseInt(v.value,10),cls:v.value_classification};
  }).catch(function(){return null;});

  fetchJSON('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true',7000)
  .then(function(d){
    if(!d||!d.bitcoin||!d.ethereum) throw new Error('empty');
    return {src:'CoinGecko',btc:d.bitcoin.usd,btcChg:d.bitcoin.usd_24h_change,eth:d.ethereum.usd,ethChg:d.ethereum.usd_24h_change};
  })
  .catch(function(){
    return fetchJSON('https://api.binance.com/api/v3/ticker/24hr?symbols=%5B%22BTCUSDT%22%2C%22ETHUSDT%22%5D',7000).then(function(arr){
      if(!Array.isArray(arr)) throw new Error('empty');
      var btc=arr.filter(function(x){return x.symbol==='BTCUSDT';})[0];
      var eth=arr.filter(function(x){return x.symbol==='ETHUSDT';})[0];
      if(!btc||!eth) throw new Error('empty');
      return {src:'Binance',btc:parseFloat(btc.lastPrice),btcChg:parseFloat(btc.priceChangePercent),eth:parseFloat(eth.lastPrice),ethChg:parseFloat(eth.priceChangePercent)};
    });
  })
  .then(function(o){ return fngP.then(function(f){ if(f){o.fng=f;} return o; }); })
  .then(function(o){ applyLive(o); return refreshQuotes().then(function(n){
    finish('실시간 반영 · '+o.src+(n?' · 종목 '+n+'개':''));
  }).catch(function(){ finish('실시간 반영 · '+o.src); }); })
  .catch(function(){ finish('실시간 시세를 못 받았습니다 · 직전 갱신 데이터 유지'); });
}

function boot(){
  S.err=null;
  fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ S.data=d; S.err=null; syncCryptoSnapshot(); applyMeta(); migrateOverrideLive(); render();
      setTimeout(function(){ refreshQuotes().catch(function(){}); },500); })
    .catch(function(e){
      S.err=(e&&e.message)||'네트워크 오류';
      if(!S.data) render();
    });
}
function refreshData(){
  fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      if(!d||!d.meta) return;
      if(!S.data || d.meta.version!==S.data.meta.version){
        S.data=d; syncCryptoSnapshot(); applyMeta(); migrateOverrideLive(); render();
        toast('데이터 갱신 적용 · v'+d.meta.version);
      }
    }).catch(function(){});
}
function applyMeta(){
  if(!S.data) return;
  $id('asof').textContent=S.data.meta.shortLabel||S.data.meta.asOfLabel;
  $id('asof').title=S.data.meta.asOfLabel+' · '+S.data.meta.nextUpdate;
  var m=document.querySelector('meta[name="description"]');
  if(m) m.setAttribute('content',S.data.meta.sourceNote.slice(0,150));
  renderRibbon();
}

/* ---------- events ---------- */
document.addEventListener('DOMContentLoaded',function(){
  loadMemos();
  loadAssets();
  loadStudy();
  loadPlans();
  loadReal();
  loadSigLog();
  loadSMeta();
  navInit();
  window.addEventListener('popstate',navBack);

  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.addEventListener('click',function(){ setTab(t.getAttribute('data-tab')); });
  });

  $id('btnTheme').addEventListener('click',toggleTheme);
  $id('btnLive').addEventListener('click',refreshLive);
  var rib=$id('ribbon');
  if(rib) rib.addEventListener('click',function(){
    if(S.tab!=='overview') setTab('overview');
    try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
  });

  var modal=$id('modal');
  modal.addEventListener('click',function(e){
    if(e.target.getAttribute('data-close')==='1'||e.target.id==='modal') closeModal();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!modal.hidden) closeModal(); });

  var hash=(location.hash||'').replace('#','');
  if(['overview','briefing','scenario','companies','study'].indexOf(hash)>=0){
    S.tab=hash;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){
      x.classList.toggle('on',x.getAttribute('data-tab')===hash);
    });
  }

  boot();
  setTimeout(function(){ if(!S.live) refreshLive(); },1200);
  setTimeout(function(){ refreshQuotes().catch(function(){}); },3000);
  setInterval(tickBrief,30000);

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') refreshData();
  });

  if(!QA&&'serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js?v=9.0').then(function(reg){
        document.addEventListener('visibilitychange',function(){
          if(document.visibilityState==='visible'){ reg.update().catch(function(){}); }
        });
      }).catch(function(){});
    });
  }
});
})();
</script>
</body>
</html>
