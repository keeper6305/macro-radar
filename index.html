<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>거시경제·투자 레이더</title>
<meta name="description" content="거시 6대 지표·반전 신호·데일리 브리핑·시나리오·킬 스위치를 한 화면에서 추적하는 모바일 대시보드.">
<meta name="theme-color" content="#070b11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="투자 레이더">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="icon" href="./favicon-16.png" sizes="16x16">
<script>
(function(){try{var t=localStorage.getItem('macro_radar_theme');
if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}
document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<style>
:root{
  /* 브랜드 v4 — 딥 그래파이트 + 샴페인 골드 */
  --bg:#070b11; --bg2:#0b111a; --card:#0f1620; --card2:#151e29;
  --line:#222e3b; --tx:#e9f0f7; --tx2:#a7b6c4; --mu:#74838f;
  --accent:#e6b764; --accent2:#f4d190; --accentbg:rgba(230,183,100,.13);
  --accRGB:230,183,100; --accOn:#16110a;
  --up:#f2555f; --down:#4e93ff;
  --upRGB:242,85,95; --downRGB:78,147,255;
  --bad:#ef5560; --warn:#e9a13c; --ok:#2fbe95; --good:#1fd0a3;
  --badRGB:239,85,96; --warnRGB:233,161,60; --goodRGB:31,208,163;
  --bad-tx:#ff8c91; --warn-tx:#f2c070; --good-tx:#48ddaf; --risk-tx:var(--risk-tx);
  --hdbg:rgba(7,11,17,.82); --toastbg:rgba(20,28,38,.96); --toasttx:#f2f6fa;
  --glow:rgba(230,183,100,.07);
  --shadow:0 10px 26px rgba(0,0,0,.38);
  --r:16px;
}
:root[data-theme="light"]{
  --bg:#f7f5f0; --bg2:#ffffff; --card:#ffffff; --card2:#f4f1ea;
  --line:#e4ded2; --tx:#12171d; --tx2:#46525e; --mu:#838b93;
  --accent:#8a6520; --accent2:#6e4f16; --accentbg:rgba(138,101,32,.10);
  --accRGB:138,101,32; --accOn:#ffffff;
  --up:#d63845; --down:#1f5fd0;
  --upRGB:214,56,69; --downRGB:31,95,208;
  --bad:#c9363e; --warn:#a86400; --ok:#0c7d57; --good:#078a64;
  --badRGB:201,54,62; --warnRGB:168,100,0; --goodRGB:7,138,100;
  --bad-tx:#b3242a; --warn-tx:#8a5300; --good-tx:#0a7a58; --risk-tx:#5b32a0;
  --hdbg:rgba(247,245,240,.88); --toastbg:rgba(24,32,44,.95); --toasttx:#f2f6fa;
  --glow:rgba(138,101,32,.05);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 20px rgba(16,24,40,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  background-image:radial-gradient(130% 55% at 50% -12%,var(--glow),transparent 62%);background-repeat:no-repeat;
  font:400 14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  letter-spacing:-.01em;overflow-wrap:anywhere}
b,strong{font-weight:700}
button{font-family:inherit}

/* header */
.hd{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
@supports ((backdrop-filter:blur(6px)) or (-webkit-backdrop-filter:blur(6px))){
  .hd{background:var(--hdbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
}
.hd-l{flex:1;min-width:0}
.brand{font-size:15px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:7px}
.brand .mk{width:21px;height:21px;border-radius:6.5px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,#f6d79a 0%,#e6b764 46%,#b4822f 100%);
  box-shadow:0 0 0 1px rgba(230,183,100,.28),0 2px 8px rgba(230,183,100,.18)}
.brand .mk svg{width:13px;height:13px;display:block}
:root[data-theme="light"] .brand .mk{box-shadow:0 0 0 1px rgba(138,101,32,.22),0 1px 4px rgba(138,101,32,.18)}
.asof{font-size:10.5px;color:var(--mu);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-r{display:flex;gap:7px;flex:none}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  width:36px;height:36px;border-radius:11px;font-size:15px;display:grid;place-items:center;padding:0;line-height:1}
.icon-btn:active{transform:scale(.95)}
.icon-btn.busy{color:var(--accent2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{max-width:760px;margin:0 auto;padding:12px 14px 96px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 2px 8px}
.sec h2{margin:0;font-size:12.5px;font-weight:700;color:var(--tx2);letter-spacing:.01em}
.sec .hint{font-size:10px;color:var(--mu);text-align:right}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--card2)}
.ch{display:flex;align-items:flex-start;gap:8px}
.ch .ic{font-size:15px;line-height:1.15;flex:none;margin-top:1px}
.ch .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.ch .sub{font-size:10.5px;color:var(--mu);font-weight:500;margin-top:1px}
.badge{flex:none;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.4}
.b-red{color:var(--bad-tx);border-color:rgba(var(--badRGB),.4);background:rgba(var(--badRGB),.13)}
.b-amber{color:var(--warn-tx);border-color:rgba(var(--warnRGB),.4);background:rgba(var(--warnRGB),.13)}
.b-green{color:var(--good-tx);border-color:rgba(var(--goodRGB),.4);background:rgba(var(--goodRGB),.13)}
.b-mute{color:var(--mu);border-color:var(--line);background:transparent}

.val{display:flex;align-items:baseline;gap:8px;margin-top:8px;flex-wrap:wrap}
.val b{font-size:25px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1}
.delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.d-up{color:var(--up);background:rgba(var(--upRGB),.12)}
.d-down{color:var(--down);background:rgba(var(--downRGB),.12)}
.d-flat{color:var(--mu);background:var(--card2)}

.row{padding-top:11px}
.row+.row{border-top:1px dashed var(--line);margin-top:11px}
.rh{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.rh .rl{font-size:11.5px;color:var(--tx2);flex:1;min-width:0}
.rh .rv{font-size:15px;font-weight:750;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none;margin-bottom:2px}
.s-red{background:var(--bad)}.s-amber{background:var(--warn)}.s-green{background:var(--good)}

/* gauge */
.gauge{position:relative;height:36px;margin-top:9px}
.track{position:absolute;left:0;right:0;top:8px;height:9px;border-radius:5px;overflow:hidden;background:var(--card2);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
.zone{position:absolute;top:0;height:100%}
.lv-bad{background:var(--bad);opacity:.9}
.lv-warn{background:var(--warn);opacity:.9}
.lv-ok{background:var(--ok);opacity:.85}
.lv-good{background:var(--good);opacity:.95}
.tick{position:absolute;top:4px;height:17px;width:1px;background:var(--tx);opacity:.4}
.tick-lb{position:absolute;top:21px;font-size:8.5px;color:var(--mu);transform:translateX(-50%);white-space:nowrap;letter-spacing:0}
.needle{position:absolute;top:2px;width:2px;height:21px;background:var(--tx);border-radius:2px;transform:translateX(-1px);
  box-shadow:0 0 0 1.5px var(--card)}
.needle:after{content:"";position:absolute;left:-2.5px;top:-2.5px;width:7px;height:7px;border-radius:50%;background:var(--tx)}
.scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mu);margin-top:1px;font-variant-numeric:tabular-nums}
.cap{font-size:10.5px;color:var(--mu);margin-top:6px;line-height:1.45}
.note-line{font-size:10px;color:var(--mu);margin-top:4px;opacity:.85}

/* sparkline */
.spk{margin-top:11px}
.spk-plot{position:relative;height:44px}
.spk svg{display:block;width:100%;height:44px}
.spk .area{fill:url(#mrGrad)}
.spk .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spk .ln.est{stroke-dasharray:3 3;opacity:.7}
.spk-dot{position:absolute;right:0;transform:translate(50%,-50%);width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}
.spk .lab{display:flex;justify-content:space-between;gap:6px;font-size:9px;color:var(--mu);margin-top:3px}
.spk .lab .est-note{opacity:.8}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-size:10px;padding:3.5px 8px;border-radius:8px;background:var(--card2);color:var(--tx2);border:1px solid var(--line);line-height:1.45}
.chip.bad{color:var(--bad-tx);border-color:rgba(var(--badRGB),.3);background:rgba(var(--badRGB),.08)}
.chip.ok{color:var(--good-tx);border-color:rgba(var(--goodRGB),.3);background:rgba(var(--goodRGB),.08)}
.chip.warn{color:var(--warn-tx);border-color:rgba(var(--warnRGB),.3);background:rgba(var(--warnRGB),.08)}
.chip.live{color:var(--accent2);border-color:rgba(var(--accRGB),.35);background:var(--accentbg);font-weight:700}

.more{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:11px;font-size:10.5px;color:var(--accent2);font-weight:600}
.more:after{content:"›";font-size:14px;line-height:1}

/* regime hero */
.hero{background:linear-gradient(160deg,rgba(var(--badRGB),.16),rgba(20,27,36,.2) 55%),var(--card);border-color:rgba(var(--badRGB),.3)}
:root[data-theme="light"] .hero{background:linear-gradient(160deg,rgba(var(--badRGB),.09),#fff 60%)}
.hero .tag{font-size:10px;font-weight:700;color:var(--bad-tx);border:1px solid rgba(var(--badRGB),.35);background:rgba(var(--badRGB),.12);padding:3px 8px;border-radius:999px}
.hero h1{margin:8px 0 2px;font-size:22px;letter-spacing:-.04em;font-weight:800}
.hero .hs{font-size:12px;color:var(--tx2)}
.hero .note{font-size:11px;color:var(--mu);margin-top:10px;line-height:1.55}
.rev-meter{margin-top:12px}
.rev-meter .rm-h{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx2);margin-bottom:5px}
.rev-meter .rm-h b{color:var(--tx);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:7px;border-radius:4px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.dots i.on{background:var(--good);box-shadow:none}
.dots i.off{background:rgba(var(--badRGB),.35)}

/* checklist */
.cl{list-style:none;margin:8px 0 0;padding:0}
.cl li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12px}
.cl li:first-child{border-top:0}
.cl .st{flex:none;font-size:12px;line-height:1.5;width:16px;text-align:center}
.cl .cn{flex:1;min-width:0}
.cl .cv{color:var(--mu);font-size:10.5px;display:block;margin-top:1px}

/* briefing */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{appearance:none;border:0;background:none;color:var(--mu);font-size:12.5px;font-weight:700;padding:8px 4px;border-radius:9px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.bh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bh h3{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.03em}
.bh .bt{font-size:10.5px;color:var(--mu)}
.bh .hs2{font-size:11.5px;color:var(--tx2);margin-top:2px}
.btable{margin-top:11px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.btable .tr{display:grid;grid-template-columns:1.5fr 1fr .8fr;font-size:11.5px;padding:7px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.btable .tr:first-child{border-top:0}
.btable .tr.th{background:var(--card2);color:var(--mu);font-size:10px;font-weight:700}
.btable .tr span:not(:first-child){text-align:right}
.btable .tr span:last-child{color:var(--down)}
.secblk{margin-top:12px}
.secblk .st2{font-size:11.5px;font-weight:800;color:var(--accent2);letter-spacing:-.01em}
.secblk p{margin:3px 0 0;font-size:12.5px;line-height:1.62;color:var(--tx)}
.analyst{margin-top:14px;padding:11px 12px;border-radius:12px;background:var(--accentbg);border:1px solid rgba(var(--accRGB),.26)}
.analyst .at{font-size:10.5px;font-weight:800;color:var(--accent2);margin-bottom:4px}
.analyst p{margin:0;font-size:12px;line-height:1.62}
.quiz{margin-top:12px;padding:12px;border-radius:12px;background:var(--card2);border:1px dashed var(--line)}
.quiz .qt{font-size:10.5px;font-weight:800;color:var(--warn);margin-bottom:5px}
.quiz p.q{margin:0;font-size:12.5px;line-height:1.62}
.mlabel{display:block;font-size:10px;color:var(--mu);margin:11px 0 4px;font-weight:700}
textarea.memo{width:100%;min-height:78px;resize:vertical;background:var(--bg2);color:var(--tx);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px;font:400 12.5px/1.6 inherit;font-family:inherit}
textarea.memo:focus{outline:none;border-color:var(--accent)}
.msave{font-size:9.5px;color:var(--mu);margin-top:4px;text-align:right;min-height:13px}
.msave.on{color:var(--ok)}
details.ans{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
details.ans summary{font-size:11px;font-weight:700;color:var(--accent2);cursor:pointer;list-style:none}
details.ans summary::-webkit-details-marker{display:none}
details.ans summary:before{content:"▸ ";font-size:10px}
details.ans[open] summary:before{content:"▾ "}
.ansbody{margin-top:8px;font-size:12px;line-height:1.68;color:var(--tx2)}
.ansbody p{margin:0 0 8px}
.ansbody p:last-child{margin-bottom:0}

/* scenario */
.scn .sm{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.scn h3{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.03em}
.scn .per{font-size:10.5px;color:var(--mu)}
.scn .sts{font-size:10px;font-weight:700;padding:2.5px 7px;border-radius:7px;margin-left:auto}
.sts-active{color:var(--bad-tx);background:rgba(var(--badRGB),.13);border:1px solid rgba(var(--badRGB),.3)}
.sts-wait{color:var(--warn-tx);background:rgba(var(--warnRGB),.12);border:1px solid rgba(var(--warnRGB),.3)}
.sts-risk{color:var(--risk-tx);background:rgba(167,110,255,.12);border:1px solid rgba(167,110,255,.3)}
.scn .th{font-size:12px;color:var(--tx2);margin-top:6px;line-height:1.6}
.prog{margin-top:10px}
.prog .ph{display:flex;justify-content:space-between;font-size:10px;color:var(--mu);margin-bottom:4px}
.pbar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.trg{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px}
.trg li{font-size:11px;color:var(--tx2);display:flex;gap:6px;align-items:flex-start}
.trg .k{flex:none;width:14px;text-align:center;font-size:10px}
.trg li.met{color:var(--tx)}
.act{margin-top:10px;padding:9px 10px;border-radius:10px;background:var(--card2);font-size:11.5px;line-height:1.6;color:var(--tx2)}

/* allocation */
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:120px;height:120px;flex:none}
.donut text{font-family:inherit}
.dl{flex:1;min-width:132px}
.dl .row2{display:flex;align-items:center;gap:7px;font-size:11.5px;margin-bottom:6px}
.dl .row2 .k{width:8px;height:8px;border-radius:2px;flex:none}
.dl .row2 .v{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.splits{margin-top:14px}
.split{margin-top:9px}
.split .sh{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-bottom:4px}
.split .sh b{color:var(--tx);font-variant-numeric:tabular-nums}
.sbar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.sbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.rules{margin:12px 0 0;padding-left:16px;font-size:11.5px;line-height:1.65;color:var(--tx2)}
.rules li{margin-bottom:4px}

/* assets */
.ah{display:flex;gap:10px;align-items:flex-start}
.anm{font-size:14px;font-weight:800;letter-spacing:-.03em}
.acode{font-size:10px;color:var(--mu);font-weight:600;margin-left:4px;letter-spacing:0}
.aqty{font-size:10.5px;color:var(--mu);margin-top:1px}
.apx{text-align:right;flex:none}
.apx b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.apx .delta{display:inline-block;margin-top:3px}
.abar{position:relative;height:26px;margin-top:14px}
.abar .at2{position:absolute;left:0;right:0;top:9px;height:8px;border-radius:5px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.abar .seg{position:absolute;top:9px;height:8px;border-radius:3px}
.abar .seg.t{background:rgba(var(--goodRGB),.55)}
.abar .seg.s{background:rgba(var(--badRGB),.4)}
.abar .mk2{position:absolute;top:4px;width:2px;height:18px;border-radius:2px;transform:translateX(-1px)}
.abar .mk2.cur{background:var(--tx);box-shadow:0 0 0 1.5px var(--card)}
.abar .mk2.avg{background:var(--warn);height:14px;top:6px;border-left:1px dashed var(--warn);width:0}
.abar .mk2.stp{background:var(--bad)}
.abar .lbl{position:absolute;top:-11px;font-size:9px;color:var(--mu);transform:translateX(-50%);white-space:nowrap}
.aleg{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:9px}
.aleg div{font-size:10.5px;color:var(--tx2);display:flex;align-items:center;gap:5px;min-width:0}
.aleg i{width:6px;height:6px;border-radius:50%;flex:none}
.aleg b{font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums;margin-left:auto}
.aleg .pct{font-size:9.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.dart{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:7px;margin-top:13px}
.dart div{background:var(--card2);border-radius:9px;padding:7px 9px;min-width:0}
.dart .k{font-size:9.5px;color:var(--mu);display:block;margin-bottom:1px}
.dart .v{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.4}
.kill{margin-top:11px;padding:9px 10px;border-radius:10px;background:rgba(var(--badRGB),.09);border:1px solid rgba(var(--badRGB),.24)}
.kill .kt{font-size:9.5px;font-weight:800;color:var(--bad-tx);margin-bottom:2px}
.kill p{margin:0;font-size:11.5px;line-height:1.55;color:var(--tx)}

  <linearGradient id="mrGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="var(--accent)" stop-opacity=".34"/>
    <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
  </linearGradient>
</defs></svg>

<noscript><div style="padding:20px;font-size:13px">이 앱은 JavaScript가 필요합니다.</div></noscript>

<script>
(function(){
'use strict';

var DATA_URL = './data/market_state.json';
var LS_MEMO = 'macro_radar_memos_v1';
var LS_THEME = 'macro_radar_theme';
var LS_AST = 'macro_radar_assets_v1';

var S = { data:null, tab:'overview', bIdx:1, live:null, err:null,
  memos:{quiz:{},brief:{},notes:[]},
  ast:{deleted:[],overrides:{},custom:[],order:[]},
  charts:{}, finMode:{}, cseq:0, edit:false, stag:'전체' };

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
function richP(s){return esc(s).split(/\n\n+/).map(function(p){return '<p>'+p.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')+'</p>';}).join('');}
function clamp(p){return Math.max(0,Math.min(100,p));}
function nf(v,d){ if(typeof v!=='number'||!isFinite(v)) return '–';
  return v.toLocaleString('ko-KR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function num(v){ if(typeof v!=='number'||!isFinite(v)) return '–';
  return v.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function bigNum(v){ if(typeof v!=='number'||!isFinite(v)) return '–';
  if(Math.abs(v)>=1000000){ return (Math.round(v/1000)/10).toLocaleString('ko-KR')+'만'; }
  return num(v); }
function sgn(v,d){ if(typeof v!=='number'||!isFinite(v)) return '–'; return (v>0?'+':'')+nf(v,d)+'%'; }
function dirClass(d){ return d==='up'?'d-up':(d==='down'?'d-down':'d-flat'); }
function $id(id){return document.getElementById(id);}
function nowHMS(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function nowStamp(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+nowHMS(); }
function isISO(d){ return /^\d{4}-\d{2}-\d{2}$/.test(String(d||'')); }
function dShort(d){ if(!isISO(d)) return String(d==null?'':d);
  return ('0'+d.slice(5,7)).slice(-2)+'.'+d.slice(8,10); }
function dLong(d){ if(!isISO(d)) return String(d==null?'':d);
  return d.slice(0,4)+'.'+d.slice(5,7)+'.'+d.slice(8,10); }
function fmtMoney(v,unit){ if(typeof v!=='number'||!isFinite(v)) return '–';
  if(unit==='억 원'){ return Math.abs(v)>=10000 ? nf(v/10000,1)+'조' : nf(v,0)+'억'; }
  if(unit==='십억 달러'||unit==='$B'){ return '$'+nf(v,1)+'B'; }
  return nf(v,0); }

var toastT;
function toast(msg,ms){
  var el=$id('toast'); el.textContent=msg; el.hidden=false;
  requestAnimationFrame(function(){el.classList.add('on');});
  clearTimeout(toastT);
  toastT=setTimeout(function(){ el.classList.remove('on'); setTimeout(function(){el.hidden=true;},220); }, ms||2600);
}

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem(LS_THEME,t); }catch(e){}
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', t==='light' ? '#f7f5f0' : '#070b11');
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='light'?'dark':'light');
  render();
}

/* ---------- memos ---------- */
function loadMemos(){
  try{
    var raw=localStorage.getItem(LS_MEMO);
    if(raw){ var o=JSON.parse(raw); if(o&&typeof o==='object'){
      S.memos={quiz:(o.quiz||{}),brief:(o.brief||{}),notes:Array.isArray(o.notes)?o.notes:[]};
    }}
  }catch(e){}
}
function saveMemos(){
  try{ localStorage.setItem(LS_MEMO, JSON.stringify(S.memos)); }
  catch(e){ toast('저장 공간이 가득 찼습니다. 내보내기로 백업해 주세요.'); }
}
function memoGet(key){
  if(key.indexOf('quiz:')===0) return S.memos.quiz[key.slice(5)]||'';
  if(key.indexOf('brief:')===0) return S.memos.brief[key.slice(6)]||'';
  return '';
}
function memoSet(key,val){
  if(key.indexOf('quiz:')===0) S.memos.quiz[key.slice(5)]=val;
  else S.memos.brief[key.slice(6)]=val;
  saveMemos();
}

/* ---------- asset store (관심기업 추가·수정·삭제) ---------- */
function loadAssets(){
  try{
    var raw=localStorage.getItem(LS_AST);
    if(!raw) return;
    var o=JSON.parse(raw);
    if(!o||typeof o!=='object') return;
    S.ast={deleted:Array.isArray(o.deleted)?o.deleted:[],
           overrides:(o.overrides&&typeof o.overrides==='object')?o.overrides:{},
           custom:Array.isArray(o.custom)?o.custom:[],
           order:Array.isArray(o.order)?o.order:[]};
    migrateSeedOrder();
  }catch(e){}
}
/* 새로 추가된 기본 종목(비트코인 등)이 저장된 순서 배열에 없으면, 기존 순서·삭제 기록을 건드리지 않고
   같은 성격의 종목 옆에 끼워 넣는다(초기화 없이 노출). */
var SEED_AFTER={'btc':'eth'};
function migrateSeedOrder(){
  var ord=S.ast.order;
  if(!ord||!ord.length) return;
  var changed=false;
  for(var id in SEED_AFTER){
    if(ord.indexOf(id)>=0) continue;
    if(S.ast.deleted.indexOf(id)>=0) continue;
    var after=SEED_AFTER[id];
    var at=ord.indexOf(after);
    if(at<0) ord.push(id); else ord.splice(at+1,0,id);
    changed=true;
  }
  if(changed) saveAssets();
}
function saveAssets(){
  try{ localStorage.setItem(LS_AST, JSON.stringify(S.ast)); }
  catch(e){ toast('저장 공간이 부족합니다. JSON으로 백업해 주세요.'); }
}
function assets(){
  var seed=(S.data&&S.data.assets)?S.data.assets:[];
  var out=[];
  seed.forEach(function(a){
    if(S.ast.deleted.indexOf(a.id)>=0) return;
    var ov=S.ast.overrides[a.id];
    if(ov){ var m={}; for(var k in a) m[k]=a[k]; for(var k2 in ov) m[k2]=ov[k2]; m.edited=true; out.push(m); }
    else out.push(a);
  });
  S.ast.custom.forEach(function(c){ out.push(c); });
  var ord=(S.ast.order||[]);
  if(ord.length){
    out.sort(function(a,b){
      var ia=ord.indexOf(a.id), ib=ord.indexOf(b.id);
      if(ia<0&&ib<0) return 0;
      if(ia<0) return 1;
      if(ib<0) return -1;
      return ia-ib;
    });
  }
  return out;
}
/* 순서 변경: 현재 화면 순서를 기준으로 저장한다 */
function orderedIds(){ return assets().map(function(a){ return a.id; }); }
function setOrder(ids){
  S.ast.order=ids.slice();
  saveAssets();
}
function moveAsset(id,dir){
  var ids=orderedIds();
  var i=ids.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=ids.length) return false;
  var moved=ids.splice(i,1)[0];
  ids.splice(j,0,moved);
  setOrder(ids);
  return true;
}
function assetById(id){
  var list=assets();
  for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i];
  return null;
}
function priceText(a){
  var mk=String(a.market||'').toUpperCase();
  if(mk==='CRYPTO') return '$'+nf(a.price, a.price<100?2:0);
  if(mk==='NASDAQ'||mk==='NYSE'||mk==='US') return '$'+nf(a.price,2);
  return nf(a.price,0)+'원';
}
function upsertAsset(obj){
  var inCustom=S.ast.custom.some(function(c){return c.id===obj.id;});
  var isCustom=inCustom||!!obj.custom;
  if(isCustom){
    obj.custom=true;
    var hit=false;
    S.ast.custom=S.ast.custom.map(function(c){ if(c.id===obj.id){ hit=true; return obj; } return c; });
    if(!hit) S.ast.custom.push(obj);
    ensureInOrder(obj.id);
  }else{
    var base=null;
    (S.data.assets||[]).forEach(function(a){ if(a.id===obj.id) base=a; });
    var ov={};
    if(base){
      ['name','code','market','price','display','avg','qty','stop','note','kill','targets','barMax'].forEach(function(k){
        var bv=base[k], nv=obj[k];
        var same = (typeof bv==='number'||typeof nv==='number') ? bv===nv : JSON.stringify(bv)===JSON.stringify(nv);
        if(!same) ov[k]=nv;
      });
    }
    S.ast.overrides[obj.id]=ov;
    ensureInOrder(obj.id);
  }
  saveAssets();
}
/* 새 종목이든 복구된 종목이든, 현재 순서에 없으면 현재 화면 순서 뒤에 붙인다 */
function ensureInOrder(id){
  var ids=orderedIds();
  if(ids.indexOf(id)<0) ids.push(id);
  setOrder(ids);
}
function removeAsset(id){
  var isCustom=S.ast.custom.some(function(c){return c.id===id;});
  if(isCustom) S.ast.custom=S.ast.custom.filter(function(c){return c.id!==id;});
  else{
    if(S.ast.deleted.indexOf(id)<0) S.ast.deleted.push(id);
    delete S.ast.overrides[id];
  }
  S.ast.order=(S.ast.order||[]).filter(function(x){ return x!==id; });
  saveAssets();
}

/* ---------- charts ---------- */
function chartId(){ S.cseq++; return 'ch'+S.cseq; }

function niceTicks(mn,mx,n){
  if(!(isFinite(mn)&&isFinite(mx))) return {lo:0,hi:1,ticks:[0,1]};
  if(mn===mx){ mn=mn-1; mx=mx+1; }
  var span=mx-mn, step=span/(n||3), mag=Math.pow(10,Math.floor(Math.log10(step)));
  var norm=step/mag, cand;
  if(norm<=1) cand=1; else if(norm<=2) cand=2; else if(norm<=2.5) cand=2.5; else if(norm<=5) cand=5; else cand=10;
  var s=cand*mag;
  var lo=Math.floor(mn/s)*s, hi=Math.ceil(mx/s)*s;
  var out=[];
  for(var v=lo; v<=hi+s*0.001; v+=s) out.push(+v.toFixed(8));
  return {lo:lo, hi:hi, ticks:out};
}

function autoDec(v){
  var a=Math.abs(v);
  if(a>=1000) return 0;
  if(a>=100) return 1;
  if(a>=10) return 2;
  return 2;
}

function lineChart(cfg){
  var s=(cfg.series||[]).filter(function(p){return p&&typeof p.v==='number';});
  if(s.length<2) return '';
  var id=chartId(), W=322, H=cfg.h||126, pl=36, pr=8, pt=12, pb=15;
  var dec=(typeof cfg.dec==='number')?cfg.dec:autoDec(s[s.length-1].v);
  var unit=cfg.unit||'';
  var vals=s.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(cfg.baseline&&typeof cfg.baseline.value==='number'){ mn=Math.min(mn,cfg.baseline.value); mx=Math.max(mx,cfg.baseline.value); }
  (cfg.refs||[]).forEach(function(r){ if(typeof r.value==='number'){ mn=Math.min(mn,r.value); mx=Math.max(mx,r.value);} });
  var pad=(mx-mn)*0.14||1; mn-=pad; mx+=pad;
  var t=niceTicks(mn,mx,3); mn=t.lo; mx=t.hi;
  var pw=W-pl-pr, ph=H-pt-pb;
  function X(i){ return pl+(s.length===1?pw/2:(i/(s.length-1))*pw); }
  function Y(v){ return pt+(1-(v-mn)/((mx-mn)||1))*ph; }

  var grid='', axis='';
  t.ticks.forEach(function(tv){
    var y=Y(tv);
    grid+='<line class="grid" x1="'+pl+'" y1="'+y.toFixed(2)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(2)+'"/>';
    axis+='<text class="ax" x="'+(pl-5)+'" y="'+(y+3).toFixed(2)+'" text-anchor="end">'+esc(nf(tv, (Math.abs(tv)>=1000?0:dec)))+'</text>';
  });

  var pts=s.map(function(p,i){ return {x:X(i), y:Y(p.v), e:!!p.e}; });
  var area='M'+pts[0].x.toFixed(2)+' '+(H-pb)+'L'+pts.map(function(q){return q.x.toFixed(2)+' '+q.y.toFixed(2);}).join('L')+
           'L'+pts[pts.length-1].x.toFixed(2)+' '+(H-pb)+'Z';
  var solid='', dash='';
  for(var i=1;i<pts.length;i++){
    var a=pts[i-1], b=pts[i];
    var seg='M'+a.x.toFixed(2)+' '+a.y.toFixed(2)+'L'+b.x.toFixed(2)+' '+b.y.toFixed(2);
    if(a.e||b.e) dash+=seg; else solid+=seg;
  }
  var base='';
  if(cfg.baseline&&typeof cfg.baseline.value==='number'){
    var by=Y(cfg.baseline.value);
    base='<line class="base" x1="'+pl+'" y1="'+by.toFixed(2)+'" x2="'+(W-pr)+'" y2="'+by.toFixed(2)+'"/>';
    if(cfg.baseline.label) base+='<text class="baselb" x="'+(W-pr)+'" y="'+(by-3).toFixed(2)+'" text-anchor="end">'+esc(cfg.baseline.label)+'</text>';
  }
  var refs='', usedY=[];
  (cfg.refs||[]).forEach(function(r){
    if(typeof r.value!=='number') return;
    var ry=Y(r.value);
    if(ry<pt-2||ry>H-pb+2) return;
    refs+='<line class="ln ref" style="stroke:'+(r.color||'var(--mu)')+'" x1="'+pl+'" y1="'+ry.toFixed(2)+'" x2="'+(W-pr)+'" y2="'+ry.toFixed(2)+'"/>';
    if(!r.label) return;
    var ly=ry-3;
    usedY.forEach(function(u){ if(Math.abs(ly-u)<9) ly=u-9; });
    if(ly<pt+5) ly=pt+5;
    usedY.push(ly);
    refs+='<text class="baselb" x="'+(W-pr)+'" y="'+ly.toFixed(2)+'" text-anchor="end" style="fill:'+(r.color||'var(--mu)')+'">'+esc(r.label)+'</text>';
  });

  var last=pts[pts.length-1];
  var gid='g'+id;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(cfg.name||'추세')+' 시계열 차트">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="'+(cfg.color||'var(--accent)')+'" stop-opacity=".34"/>'+
      '<stop offset="100%" stop-color="'+(cfg.color||'var(--accent)')+'" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    grid+base+refs+
    '<path d="'+area+'" fill="url(#'+gid+')"/>'+
    (solid?'<path class="ln" d="'+solid+'"/>':'')+
    (dash?'<path class="ln est" d="'+dash+'"/>':'')+
    '<line class="cross" x1="0" y1="'+pt+'" x2="0" y2="'+(H-pb)+'" style="display:none"/>'+
    '<circle class="hdot" r="3" cx="0" cy="0" style="display:none"/>'+
    '<circle class="dot" cx="'+last.x.toFixed(2)+'" cy="'+last.y.toFixed(2)+'" r="2.6"/>'+
    axis+
    '<text class="ax" x="'+pl+'" y="'+(H-4)+'" text-anchor="start">'+esc(dShort(s[0].d))+'</text>'+
    '<text class="ax" x="'+((pl+W-pr)/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">'+esc(dShort(s[Math.floor((s.length-1)/2)].d))+'</text>'+
    '<text class="ax" x="'+(W-pr)+'" y="'+(H-4)+'" text-anchor="end">'+esc(dShort(s[s.length-1].d))+'</text>'+
    '</svg>';

  S.charts[id]={type:'line', s:s, W:W, H:H, pl:pl, pw:pw, pt:pt, ph:ph, mn:mn, mx:mx, dec:dec, unit:unit, name:cfg.name||''};

  var est=s.some(function(p){return p.e;});
  return '<div class="chart" data-cid="'+id+'">'+svg+'<div class="ctip"></div>'+
    '<div class="src"><span>'+esc(cfg.src||'')+'</span><span>'+(est?'점선=추정 · ':'')+esc(cfg.freq||s.length+'개 시점')+'</span></div></div>';
}

/* 분기·연간 실적: 매출·영업이익 막대 + 영업이익률 선 */
function finChart(fin, mode, key){
  if(!fin) return '';
  var ps=(mode==='a'?fin.annual:fin.quarterly)||[];
  ps=ps.filter(function(p){ return typeof p.revenue==='number'; });
  if(!ps.length) return '';
  var id=chartId(), W=322, H=150, pl=34, pr=26, pt=14, pb=26;
  var pw=W-pl-pr, ph=H-pt-pb;
  var maxRev=Math.max.apply(null, ps.map(function(p){return p.revenue||0;}));
  if(maxRev<=0) maxRev=1;
  var margins=ps.map(function(p){ return (typeof p.margin==='number')?p.margin:null; }).filter(function(v){return v!==null;});
  var maxMar=Math.max.apply(null, margins.concat([5]));
  var mt=niceTicks(0, maxMar, 2); maxMar=mt.hi;
  function Y(v){ return pt+(1-v/maxRev)*ph; }
  function YM(v){ return pt+(1-v/(maxMar||1))*ph; }
  var band=pw/ps.length;
  var bars='', marPath='', labels='', dots='';
  ps.forEach(function(p,i){
    var cx=pl+band*(i+0.5);
    var bw=Math.max(6, Math.min(band*0.58, 26));
    var rh=Math.max(1,(p.revenue||0)/maxRev*ph);
    bars+='<rect class="bar1" x="'+(cx-bw/2).toFixed(2)+'" y="'+(pt+ph-rh).toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+rh.toFixed(2)+'" rx="2"'+(p.consensus?' opacity=".18"':'')+'/>';
    if(typeof p.op==='number'){
      var oh=Math.max(1, Math.abs(p.op)/maxRev*ph);
      if(p.op>=0){
        bars+='<rect class="bar2" x="'+(cx-bw/2).toFixed(2)+'" y="'+(pt+ph-oh).toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+oh.toFixed(2)+'" rx="2"'+(p.consensus?' opacity=".45"':'')+'/>';
      }else{
        var nh=Math.min(oh, ph*0.28);
        bars+='<rect class="barneg" x="'+(cx-bw/2).toFixed(2)+'" y="'+(pt+ph).toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+nh.toFixed(2)+'" rx="2"/>';
      }
    }
    labels+='<text class="bl" x="'+cx.toFixed(2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.label)+'</text>';
  });
  var mpts=[];
  ps.forEach(function(p,i){
    if(typeof p.margin!=='number') return;
    var cx=pl+band*(i+0.5), cy=YM(p.margin);
    mpts.push({x:cx,y:cy,v:p.margin,p:p});
    dots+='<circle class="mpt" cx="'+cx.toFixed(2)+'" cy="'+cy.toFixed(2)+'" r="2.2"/>';
  });
  if(mpts.length>1) marPath='<path class="mline" d="'+mpts.map(function(q,i){return (i?'L':'M')+q.x.toFixed(2)+' '+q.y.toFixed(2);}).join('')+'"/>';
  var ylab='';
  mt.ticks.forEach(function(tv){
    var y=YM(tv);
    ylab+='<text class="ax" x="'+(W-pr+4)+'" y="'+(y+3).toFixed(2)+'">'+esc(nf(tv,0))+'%</text>';
  });
  ylab+='<text class="ax" x="'+(pl-4)+'" y="'+(pt-4)+'" text-anchor="end">'+esc(fin.unit==='십억 달러'?'$B':fin.unit||'')+'</text>';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="매출·영업이익 추이">'+
    '<line class="grid" x1="'+pl+'" y1="'+(pt+ph)+'" x2="'+(W-pr)+'" y2="'+(pt+ph)+'"/>'+
    bars+marPath+dots+labels+ylab+
    '<line class="cross" x1="0" y1="'+pt+'" x2="0" y2="'+(pt+ph)+'" style="display:none"/>'+
    '</svg>';
  S.charts[id]={type:'fin', ps:ps, W:W, H:H, pl:pl, pw:pw, pt:pt, ph:ph, band:band, unit:fin.unit||''};
  return '<div class="chart finchart" data-cid="'+id+'">'+svg+'<div class="ctip"></div>'+
    '<div class="src"><span>'+esc(fin.unit==='십억 달러'?'매출·영업이익(USD)':'매출·영업이익(억 원)')+'</span><span>막대=매출·영업이익, 선=영업이익률</span></div></div>';
}

/* PER·PBR 밴드 게이지 */
function bandGauge(kind, cur, band, extra){
  if(!band||typeof cur!=='number') return '';
  var lo=band.low, hi=band.high;
  var mn=Math.min(lo,cur), mx=Math.max(hi,cur);
  var span=(mx-mn)||1, off=span*0.08; mn-=off; mx+=off;
  function pos(v){ return clamp((v-mn)/((mx-mn)||1)*100); }
  var p=pos(cur), pl=pos(lo), pm=pos(band.mid), ph=pos(hi);
  var where = cur<lo ? '밴드 하단 아래' : (cur>hi ? '밴드 상단 위' : (cur<band.mid?'하단~평균':'평균~상단'));
  var gapToLow = (cur/lo-1)*100;
  var tone = cur<=band.mid ? 'good' : 'warn';
  return '<div class="band">'+
    '<div class="bh"><span>'+esc(kind)+' 밴드'+(extra?' · '+esc(extra):'')+'</span><b>'+nf(cur,2)+'</b></div>'+
    '<div class="btr"><i class="needle" style="left:'+p.toFixed(2)+'%"></i>'+
      '<i class="bmk" style="left:'+pl.toFixed(2)+'%"></i><i class="bmk" style="left:'+ph.toFixed(2)+'%"></i></div>'+
    '<div class="bl"><span>하단 '+nf(lo,2)+'</span><span>평균 '+nf(typeof band.avg==='number'?band.avg:band.mid,2)+'</span><span>상단 '+nf(hi,2)+'</span></div>'+
    '<div class="bn '+tone+'">현재 '+esc(where)+' · 하단 대비 '+sgn(gapToLow,1)+'</div>'+
  '</div>';
}

/* PER·PBR 밴드 차트: 연말 실적 기준 배수 + 현재 위치 */
function bandSeries(a,kind){
  var key=(kind==='PER')?'per':'pbr';
  var s=[];
  (((a.fin||{}).annual)||[]).forEach(function(p){
    if(typeof p[key]==='number') s.push({d:p.label,v:p[key]});
  });
  var cur=a[key];
  if(cur&&typeof cur.cur==='number') s.push({d:'현재',v:cur.cur});
  return s;
}
function bandBlock(a,kind){
  var cur=a[(kind==='PER')?'per':'pbr'];
  if(!cur||!cur.band||typeof cur.cur!=='number') return '';
  var h='';
  var ps=bandSeries(a,kind);
  if(ps.length>2){
    h+=lineChart({series:ps,name:kind+' 밴드',h:104,dec:2,
      refs:[{value:cur.band.low,label:'하단',color:'var(--good)'},
            {value:cur.band.mid,label:'평균',color:'var(--mu)'},
            {value:cur.band.high,label:'상단',color:'var(--bad)'}],
      src:(kind==='PER'?'연말 실적 기준 PER':'연말 실적 기준 PBR')+' · 현재 포함',
      freq:'연간 시점 기준'});
  }
  h+=bandGauge(kind,cur.cur,cur.band,kind==='PER'?(cur.eps?('EPS '+nf(cur.eps,0)):''):(cur.bps?('BPS '+nf(cur.bps,0)):''));
  return h;
}

/* 시계열 바인딩 (탭/터치/호버 툴팁) */
function bindCharts(root){
  root=root||document;
  Array.prototype.forEach.call(root.querySelectorAll('.chart[data-cid]'),function(box){
    var c=S.charts[box.getAttribute('data-cid')];
    if(!c) return;
    var svg=box.querySelector('svg');
    var cross=svg.querySelector('.cross');
    var hdot=svg.querySelector('.hdot');
    var tip=box.querySelector('.ctip');
    if(!svg||!tip) return;
    box.style.touchAction='pan-y';
    function show(ev){
      var r=svg.getBoundingClientRect();
      if(!r.width) return;
      var vx=(ev.clientX-r.left)/r.width*c.W;
      var txt='', x=0;
      if(c.type==='line'){
        var i=Math.round((vx-c.pl)/(c.pw||1)*(c.s.length-1));
        i=Math.max(0,Math.min(c.s.length-1,i));
        var p=c.s[i];
        x=c.pl+(c.s.length===1?c.pw/2:(i/(c.s.length-1))*c.pw);
        var y=c.pt+(1-(p.v-c.mn)/(((c.mx-c.mn)||1)))*c.ph;
        txt=dLong(p.d)+' · '+nf(p.v,c.dec)+(c.unit||'');
        if(hdot){ hdot.setAttribute('cx',x.toFixed(2)); hdot.setAttribute('cy',(isFinite(y)?y:c.pt).toFixed(2)); hdot.style.display=''; }
        tip.style.top=(((isFinite(y)?y:c.pt)/c.H)*100).toFixed(1)+'%';
      }else{
        var bi=Math.floor((vx-c.pl)/c.band);
        bi=Math.max(0,Math.min(c.ps.length-1,bi));
        var q=c.ps[bi];
        x=c.pl+c.band*(bi+0.5);
        txt=q.label+' · 매출 '+fmtMoney(q.revenue,c.unit)+
            (typeof q.op==='number'?' · 영업이익 '+fmtMoney(q.op,c.unit):'')+
            (typeof q.margin==='number'?' ('+nf(q.margin,1)+'%)':'')+(q.consensus?' · 컨센서스':'');
        tip.style.top='12%';
      }
      cross.setAttribute('x1',x.toFixed(2)); cross.setAttribute('x2',x.toFixed(2)); cross.style.display='';
      tip.textContent=txt;
      tip.style.left=Math.max(16,Math.min(84,(x/c.W)*100)).toFixed(1)+'%';
      tip.classList.add('on');
    }
    function hide(){
      tip.classList.remove('on');
      if(cross) cross.style.display='none';
      if(hdot) hdot.style.display='none';
    }
    svg.addEventListener('pointerdown',function(ev){ ev.stopPropagation(); show(ev); });
    svg.addEventListener('pointermove',function(ev){
      if(ev.pointerType==='mouse'||ev.buttons||ev.pointerType==='touch'){ ev.stopPropagation(); show(ev); }
    });
    svg.addEventListener('pointerleave',hide);
    svg.addEventListener('pointercancel',hide);
    /* 차트 터치는 툴팁만 — 카드 상세 열기로 번지지 않게 */
    box.addEventListener('click',function(ev){ ev.stopPropagation(); });
    box.addEventListener('keydown',function(ev){ ev.stopPropagation(); });
  });
}

/* ---------- gauge (지표 밴드) ---------- */
function gauge(row){
  var sc=row.scale||{min:0,max:100,decimals:0,unit:''};
  var min=sc.min, max=sc.max, span=(max-min)||1;
  var zones=(row.zones||[]).map(function(z){
    var l=clamp((z.from-min)/span*100);
    var w=clamp((z.to-min)/span*100)-l;
    if(w<=0) return '';
    return '<span class="zone lv-'+z.level+'" style="left:'+l.toFixed(2)+'%;width:'+w.toFixed(2)+'%"></span>';
  }).join('');
  var mks=(row.markers||[]).map(function(m){
    var p=clamp((m.at-min)/span*100);
    var lp=Math.max(8,Math.min(92,p));
    return '<span class="tick" style="left:'+p.toFixed(2)+'%"></span>'+
           '<span class="tick-lb" style="left:'+lp.toFixed(2)+'%">'+esc(m.label)+'</span>';
  }).join('');
  var hasV=(typeof row.value==='number');
  var need=hasV?'<span class="needle" style="left:'+clamp((row.value-min)/span*100).toFixed(2)+'%"></span>':'';
  var u=sc.unit||'';
  function lab(v){ var d=(Math.abs(v-Math.round(v))<1e-9)?0:(sc.decimals||0);
    return v.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:d})+u; }
  return '<div class="gauge">'+need+'<div class="track">'+zones+'</div>'+
         (mks?'<div class="mks">'+mks+'</div>':'')+'</div>'+
         '<div class="scale"><span>'+esc(lab(min))+'</span><span>'+esc(lab(max))+'</span></div>';
}

function badge(signal,text){
  var cls=signal==='red'?'b-red':(signal==='amber'?'b-amber':(signal==='green'?'b-green':'b-mute'));
  var em=signal==='red'?'🔴 ':signal==='amber'?'🟡 ':signal==='green'?'🟢 ':'';
  return '<span class="badge '+cls+'">'+em+esc(text)+'</span>';
}
function sdot(s){ return '<span class="sdot s-'+(s||'amber')+'"></span>'; }

/* ---------- indicator card ---------- */
function rowChart(r,name){
  if(!r.series||r.series.length<2) return '';
  return lineChart({
    series:r.series,
    baseline:r.baseline||null,
    unit:(r.scale&&r.scale.unit)||'',
    dec:(r.scale&&typeof r.scale.decimals==='number')?r.scale.decimals:undefined,
    name:name||r.label,
    src:r.source||'',
    freq:r.freq||''
  });
}

function indCard(ind,compact){
  var rows=ind.rows||[];
  var body='';
  if(rows.length===1){
    var r=rows[0];
    var dl=r.delta?' <span class="delta '+dirClass(r.delta.dir)+'">'+esc(r.delta.text)+'</span>':'';
    body='<div class="val"><b>'+esc(r.display)+'</b>'+dl+'</div>'+gauge(r)+
      (r.caption?'<div class="cap">'+esc(r.caption)+'</div>':'')+
      rowChart(r,ind.name)+
      (r.note?'<div class="note-line">'+esc(r.note)+'</div>':'');
  } else {
    body=rows.map(function(r2){
      var dl2=r2.delta?' <span class="delta '+dirClass(r2.delta.dir)+'">'+esc(r2.delta.text)+'</span>':'';
      return '<div class="row"><div class="rh"><span class="rl">'+esc(r2.label)+dl2+'</span>'+
        '<span class="rv">'+(r2.signal?sdot(r2.signal):'')+esc(r2.display)+'</span></div>'+
        gauge(r2)+
        (r2.caption?'<div class="cap">'+esc(r2.caption)+'</div>':'')+
        rowChart(r2,r2.label)+
        (r2.note?'<div class="note-line">'+esc(r2.note)+'</div>':'')+
        '</div>';
    }).join('');
  }
  var chips=(ind.chips&&ind.chips.length)?'<div class="chips">'+ind.chips.map(function(c){
    return '<span class="chip '+(c.level||'')+'">'+esc(c.text)+'</span>';}).join('')+'</div>':'';
  var liveChip=(ind.id==='crypto'&&S.live)?'<span class="chip live">LIVE '+esc(S.live.src)+' '+esc(S.live.at)+'</span>':'';
  return '<article class="card tap '+(ind.primary?'':'mini')+'" data-ind="'+esc(ind.id)+'" tabindex="0" role="button">'+
    '<div class="ch"><span class="ic">'+esc(ind.icon||'•')+'</span>'+
      '<div class="nm">'+esc(ind.name)+(ind.summary?'<div class="sub">'+esc(ind.summary)+'</div>':'')+'</div>'+
      badge(ind.signal,ind.signalText)+'</div>'+
    body+
    (liveChip?'<div class="chips">'+liveChip+'</div>':'')+
    chips+
    '<div class="more">시계열 · 왜 중요한가</div>'+
  '</article>';
}

/* 카드 내 미니 PER·PBR 밴드 */
function miniBand(kind,cur,band){
  if(!band||typeof cur!=='number') return '';
  var lo=band.low, hi=band.high;
  var mn=Math.min(lo,cur), mx=Math.max(hi,cur);
  var span=(mx-mn)||1, off=span*0.08; mn-=off; mx+=off;
  var pos=function(v){ return clamp((v-mn)/((mx-mn)||1)*100); };
  var gap=(cur/lo-1)*100;
  var tone=(cur<=band.mid)?'':' warn';
  return '<div class="mbm"><div class="t"><span>'+esc(kind)+'</span><b>'+nf(cur,2)+'</b></div>'+
    '<div class="tr"><i style="left:'+pos(cur).toFixed(1)+'%"></i></div>'+
    '<div class="f"><span>하단 '+nf(lo,2)+'</span><em class="'+tone.trim()+'">'+(cur<lo?'하단↓ ':'')+sgn(gap,1)+'</em></div></div>';
}

/* 카드 내 미니 실적 막대(매출·영업이익) */
function miniFin(a){
  var fin=a.fin; if(!fin) return '';
  var ps=(fin.quarterly&&fin.quarterly.length?fin.quarterly:fin.annual)||[];
  ps=ps.filter(function(p){ return typeof p.revenue==='number'; });
  if(ps.length<2) return '';
  ps=ps.slice(-6);
  var W=300,H=56,pl=2,pr=2,pt=5,pb=12, pw=W-pl-pr, ph=H-pt-pb;
  var maxRev=Math.max.apply(null,ps.map(function(p){ return p.revenue||0; }))||1;
  var band=pw/ps.length, bw=Math.max(5,Math.min(band*0.56,22));
  var bars='', labs='';
  ps.forEach(function(p,i){
    var cx=pl+band*(i+0.5);
    var rh=Math.max(1,(p.revenue||0)/maxRev*ph);
    bars+='<rect class="b1" x="'+(cx-bw/2).toFixed(1)+'" y="'+(pt+ph-rh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+rh.toFixed(1)+'" rx="1.5"/>';
    if(typeof p.op==='number'){
      var oh=Math.max(1,Math.abs(p.op)/maxRev*ph);
      if(p.op>=0) bars+='<rect class="b2" x="'+(cx-bw/2).toFixed(1)+'" y="'+(pt+ph-oh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+oh.toFixed(1)+'" rx="1.5"'+(p.consensus?' opacity=".5"':'')+'/>';
      else bars+='<rect class="bn" x="'+(cx-bw/2).toFixed(1)+'" y="'+(pt+ph).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+oh.toFixed(1)+'" rx="1.5"/>';
    }
    labs+='<text class="bl" x="'+cx.toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle">'+esc(String(p.label).replace(/^20/,''))+'</text>';
  });
  var last=ps[ps.length-1];
  return '<div class="mfin"><div class="t"><span>실적 '+(fin.quarterly&&fin.quarterly.length?'분기':'연간')+'</span>'+
    '<span><b>'+esc(last.label)+'</b> 매출 '+fmtMoney(last.revenue,fin.unit||'억 원')+
    (typeof last.margin==='number'?' · 영업이익률 '+nf(last.margin,1)+'%':'')+'</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(a.name||'')+' 실적 미니 막대">'+bars+labs+'</svg></div>';
}

function miniPrice(a){
  if(!a.series||a.series.length<3) return '';
  var refs=[];
  if(typeof a.avg==='number') refs.push({value:a.avg,label:'평단',color:'var(--warn)'});
  if(typeof a.stop==='number') refs.push({value:a.stop,label:'손절',color:'var(--bad)'});
  return lineChart({series:a.series, refs:refs, name:a.name, h:112,
    src:a.seriesSource||'', freq:'최근 6개월'});
}

function assetCard(x){
  var val=(typeof x.barValue==='number')?x.barValue:x.price;
  var h='<article class="card tap" data-asset="'+esc(x.id)+'" tabindex="0" role="button"><div class="ah"><div style="min-width:0;flex:1">'+
    '<div class="anm">'+esc(x.name)+(x.custom?'<span class="tagx">내 종목</span>':'')+'<span class="acode">'+esc(x.code||'')+(x.market?' · '+esc(x.market):'')+'</span></div>'+
    '<div class="aqty">'+esc(x.qty||'')+'</div></div>'+
    '<div class="apx"><b>'+esc(x.display||'')+'</b>'+
      (x.delta?'<span class="delta '+dirClass(x.delta.dir)+'">'+esc(x.delta.text)+'</span>':'')+'</div></div>';

  h+=miniPrice(x);

  if(typeof val==='number' && (x.stop || (x.targets&&x.targets.length))){
    var tFrom=(x.targets&&x.targets.length)?x.targets[0].from:null;
    var tTo=(x.targets&&x.targets.length)?x.targets[x.targets.length-1].to:null;
    var lo=(typeof x.stop==='number')?x.stop:(x.barMin||Math.min(val,(typeof x.avg==='number'?x.avg:val))*0.97);
    var hi=x.barMax||Math.max(val*1.08,(tTo||val*1.1));
    if(hi<=lo) hi=lo*1.2;
    var span=hi-lo;
    function pos(v){ return clamp((v-lo)/span*100); }
    var seg='';
    (x.targets||[]).forEach(function(t){ seg+='<span class="seg t" style="left:'+pos(t.from).toFixed(2)+'%;width:'+Math.max(1.2,(pos(t.to)-pos(t.from))).toFixed(2)+'%"></span>'; });
    var marks='<span class="mk2 cur" style="left:'+pos(val).toFixed(2)+'%"></span>';
    if(typeof x.avg==='number') marks+='<span class="mk2 avg" style="left:'+pos(x.avg).toFixed(2)+'%"></span>';
    if(typeof x.stop==='number') marks='<span class="mk2 stp" style="left:'+Math.max(0.6,pos(x.stop)).toFixed(2)+'%"></span>'+marks;
    h+='<div class="abar"><span class="at2"></span>'+seg+marks+
      '<span class="lbl" style="left:'+Math.max(12,Math.min(88,pos(val))).toFixed(2)+'%">현재</span></div>';

    var lg=[];
    var bu=(x.barUnit==='$')?'$':'';
    lg.push('<div><i style="background:var(--tx)"></i>현재<b>'+esc(x.display)+'</b></div>');
    if(typeof x.avg==='number') lg.push('<div><i style="background:var(--warn)"></i>평단<b>'+bu+bigNum(x.avg)+'</b><span class="pct">'+sgn((val/x.avg-1)*100,1)+'</span></div>');
    if(typeof x.stop==='number') lg.push('<div><i style="background:var(--bad)"></i>손절<b>'+bu+bigNum(x.stop)+'</b><span class="pct">'+sgn((x.stop/val-1)*100,1)+'</span></div>');
    (x.targets||[]).forEach(function(t){
      lg.push('<div><i style="background:var(--good)"></i>'+esc(t.label)+'<b>'+bu+bigNum(t.from)+(t.to!==t.from?'~'+bigNum(t.to):'')+'</b>'+
        '<span class="pct">'+sgn((t.from/val-1)*100,1)+'</span></div>');
    });
    h+='<div class="aleg">'+lg.join('')+'</div>';
  }

  var chips=[];
  if(typeof x.roe==='number') chips.push('ROE '+nf(x.roe,1)+'%');
  if(x.foreign) chips.push('외인 '+x.foreign);
  if(x.insiders&&x.insiders.length){
    var ia=insiderAvg(x);
    if(ia) chips.push('내부자 평단 '+bigNum(ia)+' · '+sgn((x.price/ia-1)*100,1));
  }

  /* 핵심 미니 지표: PER·PBR 밴드 */
  var mb='';
  if(x.per&&x.per.band) mb+=miniBand('PER',x.per.cur,x.per.band);
  if(x.pbr&&x.pbr.band) mb+=miniBand('PBR',x.pbr.cur,x.pbr.band);
  if(mb) h+='<div class="mbmeter">'+mb+'</div>';
  /* 실적 미니 막대 */
  h+=miniFin(x);

  if(chips.length) h+='<div class="chips">'+chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('')+'</div>';
  h+='<div class="actrow"><button class="btn" data-open="'+esc(x.id)+'">밴드·실적 상세 ›</button>'+
     '<button class="btn ghost" data-edit="'+esc(x.id)+'">수정</button></div>';
  return h+'</article>';
}

function insiderAvg(a){
  var q=0, amt=0;
  (a.insiders||[]).forEach(function(r){
    if(typeof r.px==='number'&&typeof r.qty==='number'&&r.qty>0&&r.kind.indexOf('매수')>=0){ q+=r.qty; amt+=r.px*r.qty; }
  });
  if(!q) return null;
  return Math.round(amt/q);
}

function saveAssetFromForm(id){
  var g=function(k){ var el=document.querySelector('[data-f="'+k+'"]'); return el?el.value.trim():''; };
  var name=g('name'); if(!name){ var e=$id('formErr'); e.textContent='종목명을 입력해 주세요.'; e.hidden=false; return; }
  var numOr=function(v){ if(!v) return null; var n=parseNum(v); return (isNaN(n)?null:n); };
  function parseNum(v){ return parseFloat(String(v).replace(/[,\s원$%]/g,'')); }
  var price=numOr(g('price'));
  var avg=numOr(g('avg'));
  var stop=numOr(g('stop'));
  var tf=numOr(g('targetFrom')), tt=numOr(g('targetTo'));
  var market=g('market')||'KOSPI';
  var targets=[];
  if(tf!=null) targets.push({label:'1차',from:tf,to:(tt!=null?tt:tf)});
  var base=id?assetById(id):null;
  var prev=base||{};
  /* 수정 시 2차 등 나머지 목표가 구간은 보존 */
  if(base&&prev.targets&&prev.targets.length>1){
    targets=targets.concat(prev.targets.slice(1));
  }
  var obj={
    id:id||('c'+Date.now()),
    name:name,
    code:g('code'),
    market:market,
    price:(price!=null?price:(prev.price!=null?prev.price:null)),
    avg:avg, qty:g('qty'), stop:stop,
    targets:targets,
    kill:g('kill'), note:g('note'),
    series:prev.series||null, seriesSource:prev.seriesSource||'',
    fin:prev.fin||null, per:prev.per||null, pbr:prev.pbr||null,
    insiders:prev.insiders||[], leading:prev.leading||[], returns:prev.returns||[],
    barMax:prev.barMax||null,
    custom: prev.custom||!base
  };
  if(obj.price!=null) obj.display=priceText(obj);
  else obj.display='가격 미입력';
  if(obj.targets.length===0) delete obj.targets;
  upsertAsset(obj);
  if(!id) setOrder(orderedIds());
  toast(id?'수정했습니다.':'종목을 추가했습니다.');
  render();
  if(id) openAsset(id); else closeModal();
}

/* ---------- study ---------- */
function viewStudy(){
  var all=S.data.study||[];
  var tags=['전체'];
  all.forEach(function(s){ if(tags.indexOf(s.tag)<0) tags.push(s.tag); });
  var cur=S.stag||'전체';
  if(tags.indexOf(cur)<0) cur='전체';
  var items=all.filter(function(s){ return cur==='전체'||s.tag===cur; });
  var h='<div class="sec"><h2>공부 도감</h2><span class="hint">'+all.length+'개 · '+(cur==='전체'?'전체':cur+' '+items.length+'개')+'</span></div>';
  h+='<div class="sfilter">'+tags.map(function(t){
      return '<button data-stag="'+esc(t)+'" class="'+(t===cur?'on':'')+'" aria-pressed="'+(t===cur?'true':'false')+'">'+esc(t)+'</button>';
    }).join('')+'</div>';
  h+=items.map(function(s){
    var tbl='';
    if(s.table){
      tbl='<div class="stbl"><div class="sr">'+s.table.head.map(function(c){return '<span>'+esc(c)+'</span>';}).join('')+'</div>'+
        s.table.rows.map(function(r){return '<div class="sr">'+r.map(function(c){return '<span>'+esc(c)+'</span>';}).join('')+'</div>';}).join('')+'</div>';
    }
    return '<details class="study"><summary><span class="tg2">'+esc(s.tag)+'</span>'+
      '<span class="sn">'+esc(s.title)+'</span><span class="chv">›</span></summary>'+
      '<div class="study-body"><p class="ss">'+esc(s.summary)+'</p>'+tbl+
      (s.body||[]).map(function(b){return '<p class="bp">'+rich(b)+'</p>';}).join('')+
      (s.check&&s.check.length?'<div class="study-ck"><div class="ckt">✔ 실전 체크포인트</div><ul>'+
        s.check.map(function(c){return '<li>'+rich(c)+'</li>';}).join('')+'</ul></div>':'')+
      '</div></details>';
  }).join('');
  h+='<div class="foot">숫자는 11/17 브리핑·3분기 DART 원문과 국세청·기획재정부 2026년 시행 기준입니다. 판단의 근거 자료이며 매매 권유가 아닙니다.</div>';
  return h;
}

/* ---------- render ---------- */
function render(){
  var main=$id('main');
  if(S.err){
    main.innerHTML='<div class="err"><b>데이터를 불러오지 못했습니다.</b><br>'+esc(S.err)+
      '<div class="toolrow"><button class="btn pri" id="btnRetry">다시 시도</button></div></div>';
    var rb=$id('btnRetry'); if(rb) rb.addEventListener('click',boot);
    return;
  }
  if(!S.data) return;
  S.charts={};
  var html='';
  if(S.tab==='overview') html=viewOverview();
  else if(S.tab==='briefing') html=viewBriefing();
  else if(S.tab==='scenario') html=viewScenario();
  else if(S.tab==='companies') html=viewCompanies();
  else html=viewStudy();
  main.innerHTML=html;
  bindView();
  bindCharts();
}

function setTab(t){
  S.tab=t;
  if(t!=='companies') S.edit=false;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){
    var on=x.getAttribute('data-tab')===t;
    x.classList.toggle('on',on);
    x.setAttribute('aria-selected',on?'true':'false');
  });
  window.scrollTo(0,0);
  render();
}

/* ---------- modal ---------- */
function openSheet(html){
  var sheet=$id('msheet');
  sheet.innerHTML=html;
  $id('modal').hidden=false;
  document.body.style.overflow='hidden';
  sheet.scrollTop=0;
  bindSheet();
}

function bindSheet(){
  var sheet=$id('msheet');
  Array.prototype.forEach.call(sheet.querySelectorAll('[data-close]'),function(b){
    b.addEventListener('click',closeModal);
  });
  Array.prototype.forEach.call(sheet.querySelectorAll('[data-edit]'),function(b){
    b.addEventListener('click',function(){ openAssetForm(b.getAttribute('data-edit')); });
  });
  Array.prototype.forEach.call(sheet.querySelectorAll('[data-del]'),function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-del');
      var a=assetById(id); if(!a) return;
      if(!window.confirm('"'+a.name+'" 종목을 목록에서 삭제할까요? 메모·가설 노트는 그대로 남습니다.')) return;
      removeAsset(id); closeModal(); render(); toast('삭제했습니다.');
    });
  });
  var save=$id('btnSaveAsset');
  if(save) save.addEventListener('click',function(){ saveAssetFromForm(save.getAttribute('data-id')||null); });
  Array.prototype.forEach.call(sheet.querySelectorAll('[data-fin]'),function(b){
    b.addEventListener('click',function(){
      var mode=b.getAttribute('data-fin');
      var cur=S.curAsset; if(!cur) return;
      S.finMode[cur]=mode;
      openAsset(cur);
    });
  });
  bindCharts(sheet);
}

/* ---------- memo io ---------- */
function exportJSON(){
  var payload={app:'macro-radar',version:3,exportedAt:nowStamp(),memos:S.memos,assets:S.ast};
  var s=JSON.stringify(payload,null,2);
  var blob=new Blob([s],{type:'application/json'});
  var a=document.createElement('a');
  var d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download='macro-radar-backup-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1200);
  toast('메모·관심기업을 내보냈습니다.');
}
function importJSON(ev){
  var f=ev.target.files&&ev.target.files[0];
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(String(fr.result));
      var m=o&&o.memos?o.memos:o;
      var cnt=0;
      if(m&&typeof m==='object'){
        var q=m.quiz||{}, b=m.brief||{}, n=Array.isArray(m.notes)?m.notes:[];
        Object.keys(q).forEach(function(k){ S.memos.quiz[k]=q[k]; cnt++; });
        Object.keys(b).forEach(function(k){ S.memos.brief[k]=b[k]; cnt++; });
        n.forEach(function(x){ if(x&&x.text){ S.memos.notes.unshift(x); cnt++; } });
        saveMemos();
      }
      if(o&&o.assets&&typeof o.assets==='object'){
        var A=o.assets;
        S.ast={deleted:Array.isArray(A.deleted)?A.deleted:[],
               overrides:(A.overrides&&typeof A.overrides==='object')?A.overrides:{},
               custom:Array.isArray(A.custom)?A.custom:[],
               order:Array.isArray(A.order)?A.order:[]};
        saveAssets(); cnt+=S.ast.custom.length;
      }
      render();
      toast('불러왔습니다 · '+cnt+'개 항목');
    }catch(e){ toast('불러오지 못했습니다. 내보낸 JSON 파일인지 확인해 주세요.'); }
  };
  fr.readAsText(f);
  ev.target.value='';
}

/* ---------- live crypto ---------- */
function fetchJSON(url,ms){
  var ctl=new AbortController();
  var t=setTimeout(function(){ctl.abort();},ms||6000);
  return fetch(url,{signal:ctl.signal,cache:'no-store'}).then(function(r){
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).catch(function(e){ clearTimeout(t); throw e; });
}
function applyLive(o){
  S.live={src:o.src,at:nowHMS(),btc:o.btc,eth:o.eth,fng:o.fng||null};
  var cr=S.data.indicators.filter(function(x){return x.id==='crypto';})[0];
  if(cr){
    cr.rows.forEach(function(r){
      if(r.label==='BTC'&&typeof o.btc==='number'){
        r.value=o.btc; r.display='$'+nf(Math.round(o.btc),0);
        if(typeof o.btcChg==='number') r.delta={text:sgn(o.btcChg,2),dir:o.btcChg>=0?'up':'down'};
      }
      if(r.label==='ETH'&&typeof o.eth==='number'){
        r.value=o.eth; r.display='$'+nf(Math.round(o.eth),0);
        if(typeof o.ethChg==='number') r.delta={text:sgn(o.ethChg,2),dir:o.ethChg>=0?'up':'down'};
      }
    });
    if(o.fng){
      cr.chips=(cr.chips||[]).filter(function(c){return c.text.indexOf('공포탐욕')<0;});
      cr.chips.push({text:'공포탐욕 '+o.fng.value+' · '+fngKo(o.fng.cls),level:o.fng.value<25?'bad':(o.fng.value>75?'warn':'')});
    }
  }
  /* '종목' 탭 비트코인 카드도 같은 실시간 값으로 맞춘다(지표와 종목 숫자 불일치 방지) */
  var ba=null;
  (S.data.assets||[]).forEach(function(a){ if(a.id==='btc') ba=a; });
  if(ba&&typeof o.btc==='number'){
    ba.price=o.btc;
    ba.display='$'+nf(Math.round(o.btc),0);
    if(typeof o.btcChg==='number') ba.delta={text:sgn(o.btcChg,2),dir:o.btcChg>=0?'up':'down'};
    if(ba.series&&ba.series.length){
      var td=todayISO(), lst=ba.series[ba.series.length-1];
      if(lst.d===td) lst.v=Math.round(o.btc); else ba.series.push({d:td,v:Math.round(o.btc)});
    }
  }
  if(S.tab==='overview'||S.tab==='companies') render();
}
function todayISO(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function fngKo(cls){
  var m={'Extreme Fear':'극단적 공포','Fear':'공포','Neutral':'중립','Greed':'탐욕','Extreme Greed':'극단적 탐욕'};
  return m[cls]||cls||'';
}
function refreshLive(){
  var b=$id('btnLive');
  b.classList.add('busy');
  var done=false;
  function finish(msg){ if(done) return; done=true; b.classList.remove('busy'); if(msg) toast(msg); }
  var fngP=fetchJSON('https://api.alternative.me/fng/?limit=1',5000).then(function(d){
    var v=d&&d.data&&d.data[0]; if(!v) return null;
    return {value:parseInt(v.value,10),cls:v.value_classification};
  }).catch(function(){return null;});

  fetchJSON('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true',7000)
  .then(function(d){
    if(!d||!d.bitcoin||!d.ethereum) throw new Error('empty');
    return {src:'CoinGecko',btc:d.bitcoin.usd,btcChg:d.bitcoin.usd_24h_change,eth:d.ethereum.usd,ethChg:d.ethereum.usd_24h_change};
  })
  .catch(function(){
    return fetchJSON('https://api.binance.com/api/v3/ticker/24hr?symbols=%5B%22BTCUSDT%22%2C%22ETHUSDT%22%5D',7000).then(function(arr){
      if(!Array.isArray(arr)) throw new Error('empty');
      var btc=arr.filter(function(x){return x.symbol==='BTCUSDT';})[0];
      var eth=arr.filter(function(x){return x.symbol==='ETHUSDT';})[0];
      if(!btc||!eth) throw new Error('empty');
      return {src:'Binance',btc:parseFloat(btc.lastPrice),btcChg:parseFloat(btc.priceChangePercent),eth:parseFloat(eth.lastPrice),ethChg:parseFloat(eth.priceChangePercent)};
    });
  })
  .then(function(o){ return fngP.then(function(f){ if(f){o.fng=f;} return o; }); })
  .then(function(o){ applyLive(o); finish('실시간 반영 · '+o.src+' '+nowHMS()); })
  .catch(function(){ finish('실시간 시세를 못 받았습니다 · 17:00 기준 데이터 유지'); });
}

/* ---------- boot ---------- */
function boot(){
  S.err=null;
  fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ S.data=d; S.err=null; applyMeta(); render(); })
    .catch(function(e){
      S.err=(e&&e.message)||'네트워크 오류';
      if(!S.data) render();
    });
}
function refreshData(){
  fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      if(!d||!d.meta) return;
      if(!S.data || d.meta.version!==S.data.meta.version){
        S.data=d; applyMeta(); render();
        toast('데이터 갱신 적용 · v'+d.meta.version);
      }
    }).catch(function(){});
}
function applyMeta(){
  if(!S.data) return;
  $id('asof').textContent=S.data.meta.shortLabel||S.data.meta.asOfLabel;
  $id('asof').title=S.data.meta.asOfLabel+' · '+S.data.meta.nextUpdate;
  var m=document.querySelector('meta[name="description"]');
  if(m) m.setAttribute('content',S.data.meta.sourceNote.slice(0,150));
}

/* ---------- events ---------- */
document.addEventListener('DOMContentLoaded',function(){
  loadMemos();
  loadAssets();

  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.addEventListener('click',function(){ setTab(t.getAttribute('data-tab')); });
  });

  $id('btnTheme').addEventListener('click',toggleTheme);
  $id('btnLive').addEventListener('click',refreshLive);

  var modal=$id('modal');
  modal.addEventListener('click',function(e){
    if(e.target.getAttribute('data-close')==='1'||e.target.id==='modal') closeModal();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!modal.hidden) closeModal(); });

  var hash=(location.hash||'').replace('#','');
  if(['overview','briefing','scenario','companies','study'].indexOf(hash)>=0){
    S.tab=hash;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){
      x.classList.toggle('on',x.getAttribute('data-tab')===hash);
    });
  }

  boot();
  setTimeout(function(){ if(!S.live) refreshLive(); },1200);

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') refreshData();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        document.addEventListener('visibilitychange',function(){
          if(document.visibilityState==='visible'){ reg.update().catch(function(){}); }
        });
      }).catch(function(){});
    });
  }
});
})();
</script>
</body>
</html>
