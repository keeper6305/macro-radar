<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>macro-radar v4 QA</title>
<style>
  body{margin:0;background:#0b0e12;color:#e7eef6;font:12px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif}
  h1{font-size:13px;margin:0;padding:9px 12px;background:#12171e;border-bottom:1px solid #2a3341;font-weight:700}
  h1 b{color:#e6b764}
  #row{display:flex;gap:10px;padding:10px;align-items:flex-start;overflow:auto}
  iframe{border:1px solid #33404f;background:#070b11;flex:none;display:block}
  pre{white-space:pre-wrap;font-size:11px;padding:10px 12px;margin:0;color:#cfe0ff;background:#0d1218;border-top:1px solid #2a3341}
  .w{font-size:10px;color:#8ea0b4;padding:3px 0}
</style>
</head>
<body>
<h1>거시경제·투자 레이더 <b>v4</b> QA — 로고·색상 · BTC 카드/상세 · 360/390/430 가로 오버플로</h1>
<div id="row"></div>
<pre id="out">running…</pre>
<script>
var THEME = new URLSearchParams(location.search).get('theme') || 'dark';
var SHOT = new URLSearchParams(location.search).get('shot') || '';
var wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
var log = {};

function mkFrame(w, src, h){
  var f = document.createElement('iframe');
  f.width = w; f.height = h || 900; f.src = src;
  document.getElementById('row').appendChild(f);
  if(!SHOT){
    var lab = document.createElement('div');
    lab.className = 'w'; lab.textContent = w + 'px';
  }
  return new Promise(function(res){
    f.addEventListener('load', function(){ setTimeout(function(){ res(f); }, 2600); }, {once:true});
  });
}
function overflow(f, sel){
  var d = f.contentDocument, win = f.contentWindow, de = d.documentElement;
  var bad = [].slice.call(d.querySelectorAll(sel || 'main *')).filter(function(el){
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.right > win.innerWidth + 1;
  }).slice(0, 5).map(function(el){
    return el.tagName.toLowerCase() + '.' + String(el.className).slice(0, 20) + '@' + Math.round(el.getBoundingClientRect().right);
  });
  // 문서 전체에서 가로로 넘치는 고정 요소 포함 재확인
  var wide = [].slice.call(d.querySelectorAll('body *')).filter(function(el){
    var r = el.getBoundingClientRect();
    return r.width > win.innerWidth + 1;
  }).slice(0, 4).map(function(el){ return el.tagName.toLowerCase() + '.' + String(el.className).slice(0, 18) + ' w=' + Math.round(el.getBoundingClientRect().width); });
  return { iw: win.innerWidth, docOverflow: de.scrollWidth - de.clientWidth,
           bodyOverflow: d.body.scrollWidth - win.innerWidth, bad: bad, tooWide: wide };
}

async function main(){
  try{ localStorage.setItem('macro_radar_theme', THEME); }catch(e){}
  var MULTI = new URLSearchParams(location.search).get('multi');
  if(MULTI){
    var widths=[360,390,430], keep=[];
    for (var k=0;k<3;k++){
      var col=document.createElement('div');
      col.style.cssText='flex:none;display:flex;flex-direction:column;gap:4px';
      var lab=document.createElement('div'); lab.className='w'; lab.textContent=widths[k]+'px';
      var fr=document.createElement('iframe'); fr.width=widths[k]; fr.height=820; fr.src='./index.html?multi='+widths[k]+'&v='+Date.now();
      col.appendChild(lab); col.appendChild(fr);
      document.getElementById('row').appendChild(col);
      keep.push(fr);
    }
    for (var n=0;n<keep.length;n++){
      await new Promise(function(res){ keep[n].addEventListener('load',function(){ setTimeout(res,2400); },{once:true}); });
      keep[n].contentDocument.querySelector('.tab[data-tab="companies"]').click();
    }
    await wait(900);
    document.getElementById('out').textContent='multi ready · '+widths.join(' / ')+'px · 종목 탭';
    document.title='QA DONE';
    return;
  }
  if(SHOT){
    // 스크린샷 전용: 단일 프레임에서 BTC 상세 시트를 연 상태로 정지
    var f = await mkFrame(390, './index.html?qa=shot', 844);
    var d = f.contentDocument;
    d.querySelector('.tab[data-tab="companies"]').click();
    await wait(500);
    var card = d.querySelector('main [data-asset="btc"]');
    if(card){ card.querySelector('[data-open]').click(); }
    await wait(700);
    document.getElementById('out').textContent = 'shot ready · ' + (d.querySelector('.mhd h3') ? d.querySelector('.mhd h3').textContent : 'no modal');
    document.title = 'QA DONE';
    return;
  }

  /* 1) 기존 사용자 흔적(비트코인 없는 저장 순서) → 초기화 없이 병합되는지 */
  try{
    localStorage.setItem('macro_radar_assets_v1', JSON.stringify({
      deleted: [], overrides: { gamsung: { qty: '43주 보유' } }, custom: [],
      order: ['samsung','gamsung','eth','google','hynix','hdelectric','hyosung']
    }));
    localStorage.setItem('macro_radar_theme', THEME);
  }catch(e){ log.seedErr = String(e); }
  var m = await mkFrame(390, './index.html?qa=migrate', 700);
  var md = m.contentDocument;
  md.querySelector('.tab[data-tab="companies"]').click();
  await wait(500);
  log.migrate = {
    order: (function(){ try{ return JSON.parse(m.contentWindow.localStorage.getItem('macro_radar_assets_v1')).order; }catch(e){ return 'ERR'; } })(),
    cards: [].slice.call(md.querySelectorAll('main [data-asset]')).map(function(x){ return x.dataset.asset; }),
    gamsungQty: (md.querySelector('main [data-asset="gamsung"] .aqty') || {}).textContent,
    errs: (m.contentWindow.__errs || []).slice(0, 5)
  };
  m.remove();

  /* 2) 폭별 측정: 지표 탭 → 종목 탭 → BTC 상세 */
  log.widths = [];
  for (var i = 0; i < 3; i++){
    var w = [360, 390, 430][i];
    var f = await mkFrame(w, './index.html?qa=w' + w + '&v=' + Date.now(), 900);
    var d = f.contentDocument, win = f.contentWindow;
    var r = { w: w, theme: d.documentElement.getAttribute('data-theme'), errs: (win.__errs || []).slice(0, 5) };
    r.overview = overflow(f);
    d.querySelector('.tab[data-tab="companies"]').click();
    await wait(650);
    r.companies = overflow(f);
    r.cards = d.querySelectorAll('main [data-asset]').length;
    var card = d.querySelector('main [data-asset="btc"]');
    r.btcCardText = card ? card.textContent.replace(/\s+/g, ' ').trim().slice(0, 300) : 'MISSING';
    r.legend = card ? [].slice.call(card.querySelectorAll('.aleg div')).map(function(x){ return x.textContent.replace(/\s+/g, ' ').trim(); }) : [];
    r.barLabels = card ? [].slice.call(card.querySelectorAll('.abar .lbl, .abar .mk2')).length : 0;
    if (card){
      card.querySelector('[data-open]').click();
      await wait(700);
      r.detail = overflow(f, '.modal *, .sheet *');
      var sheet = d.querySelector('.modal, .sheet');
      r.detailTitle = (d.querySelector('.mhd h3') || {}).textContent;
      r.detailBody = sheet ? sheet.textContent.replace(/\s+/g, ' ').trim().slice(0, 1400) : 'NO MODAL';
      r.hasFinSection = /실적 · 영업이익률/.test(r.detailBody);
      r.hasInsider = /내부자 매수/.test(r.detailBody);
      d.querySelector('[data-close]') && d.querySelector('[data-close]').click();
    }
    log.widths.push(r);
    if (i < 2) f.remove();
  }

  /* 3) 배포 자산 상태 */
  log.sw = await fetch('./sw.js', {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){ return (t.match(/macro-radar-v\d/) || ['?'])[0]; });
  log.icons = {};
  for (var j = 0; j < ['icon-192.png','icon-512.png','icon-maskable-512.png','apple-touch-icon.png','favicon-32.png','favicon-16.png','favicon.svg','manifest.json'].length; j++){
    var name = ['icon-192.png','icon-512.png','icon-maskable-512.png','apple-touch-icon.png','favicon-32.png','favicon-16.png','favicon.svg','manifest.json'][j];
    log.icons[name] = await fetch('./' + name, {cache:'no-store'}).then(function(r){ return r.status + ' ' + (r.headers.get('content-type') || ''); });
  }
  log.mainErrs = (window.__errs || []).slice(0, 5);

  document.getElementById('out').textContent = JSON.stringify(log, null, 1);
  document.title = 'QA DONE';
}
main().catch(function(e){
  document.getElementById('out').textContent = 'FAIL: ' + (e && e.stack || e);
  document.title = 'QA DONE';
});
</script>
</body>
</html>
